<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:sans-serif;
background:#0b1b2b;
color:white;
}

.header{
text-align:center;
padding:12px;
color:#ff7a00;
font-size:22px;
font-weight:bold;
}

.card{
background:#13263d;
padding:15px;
margin:10px;
border-radius:12px;
}

input,select,textarea{
width:100%;
padding:12px;
margin:6px 0;
background:#0b1b2b;
color:white;
border:none;
border-radius:8px;
}

button{
width:100%;
padding:12px;
background:#ff7a00;
border:none;
border-radius:8px;
color:white;
font-weight:bold;
}

.result{
margin-top:10px;
padding:10px;
background:#07121f;
border-radius:8px;
}
</style>

</head>

<body>

<div class="header">🔥 MeltingPro Smart Assistant</div>

<!-- Furnace -->
<div class="card">
<h3>🔥 Furnace Metal</h3>

<input id="top" placeholder="Top Dia">
<input id="bottom" placeholder="Bottom Dia">
<input id="height" placeholder="Height">
<input id="fill" placeholder="Fill %">

<button onclick="calcMetal()">Calculate</button>

<div id="metalRes" class="result"></div>
</div>

<!-- Carbon -->
<div class="card">
<h3>🔥 Carbon</h3>

<select id="mode">
<option value="up">UP</option>
<option value="down">DOWN</option>
</select>

<input id="metal" placeholder="Metal kg">
<input id="c1" placeholder="Current C%">
<input id="c2" placeholder="Target C%">
<input id="ci" placeholder="CI% / FeO">

<button onclick="calcCarbon()">Calculate</button>

<div id="carbonRes" class="result"></div>
</div>

<!-- Mn -->
<div class="card">
<h3>⚡ Si-Mn</h3>

<input id="heat" placeholder="Heat kg">
<input id="mn1" placeholder="Current Mn%">
<input id="mn2" placeholder="Target Mn%">
<input id="alloy" placeholder="Alloy Mn%">
<input id="rec" placeholder="Recovery">

<button onclick="calcMn()">Calculate</button>

<div id="mnRes" class="result"></div>
<div id="aiSuggest" class="result"></div>

</div>

<!-- AI -->
<div class="card">
<h3>🤖 Spectro AI</h3>

<textarea id="spec"></textarea>

<button onclick="analyze()">Analyze</button>

<div id="aiRes" class="result"></div>
</div>

<!-- Report -->
<div class="card">
<h3>📄 Report</h3>

<button onclick="genReport()">Generate</button>
<button onclick="sendWA()">📤 WhatsApp</button>

<textarea id="report"></textarea>

</div>

<script>

// Furnace
function calcMetal(){
let t=+top.value||0;
let b=+bottom.value||0;
let h=+height.value||0;
let f=(+fill.value||90)/100;

let vol=Math.PI*h*(t/2)*(b/2);
let ton=(vol*7.8*f)/1000000;

metalRes.innerHTML="🔥 "+ton.toFixed(2)+" Ton";
}

// Carbon
function calcCarbon(){
let m=+metal.value||0;
let c1v=+c1.value||0;
let c2v=+c2.value||0;
let val=+ci.value||1;

if(mode.value=="up"){
carbonRes.innerHTML="↑ "+((m*(c2v-c1v))/(val/100*0.8)).toFixed(1)+" kg";
}else{
carbonRes.innerHTML="↓ "+((m*(c1v-c2v))/(val/100)).toFixed(1)+" kg";
}
}

// Mn
function calcMn(){
let req=(heat.value*(mn2.value-mn1.value))/((alloy.value/100)*(rec.value/100));
mnRes.innerHTML="⚡ "+req.toFixed(1)+" kg";

let msg="";
if(mn2.value-mn1.value>0.3) msg+="⚠ Mn low<br>";
aiSuggest.innerHTML=msg;
}

// AI
function analyze(){
let t=spec.value.toLowerCase();
let grade="XLS";

if(t.includes("0.2")) grade="Fe500";
if(t.includes("0.04")) grade="Fe500D";
if(t.includes("0.15")) grade="E250";

aiRes.innerHTML="🏆 "+grade;
}

// Report
function genReport(){
report.value=`
Heat Report
Metal: ${metalRes.innerText}
Carbon: ${carbonRes.innerText}
Mn: ${mnRes.innerText}
AI: ${aiRes.innerText}
`;
}

// WhatsApp
function sendWA(){
window.open("https://wa.me/?text="+encodeURIComponent(report.value));
}

</script>

</body>
</html>
