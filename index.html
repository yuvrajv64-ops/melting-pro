<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeltingPro – Furnace Metal Calculator</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#fff;}

.header{padding:10px;text-align:center;font-weight:bold;color:#f97316;}

.card{background:#1e293b;padding:15px;margin:10px;border-radius:10px;}

input,select{
width:100%;padding:10px;margin:5px 0;
background:#0f172a;color:#fff;border:none;border-radius:5px;
}

button{
width:100%;padding:12px;background:#f97316;
border:none;color:#000;font-weight:bold;margin-top:10px;border-radius:5px;
}

.result{margin-top:10px;padding:10px;background:#111827;border-radius:5px;}

.green{border:2px solid #22c55e;}
.red{border:2px solid #ef4444;}

.banner{
background:#f97316;color:#000;text-align:center;padding:8px;font-weight:bold;
}
</style>
</head>

<body>

<div id="maint" class="banner"></div>

<div class="header">
🔥 MeltingPro – Furnace Metal Calculator
</div>

<div class="card">
<select id="tool" onchange="showTool()">
<option value="furnace">Furnace Metal</option>
<option value="carbon">Carbon</option>
<option value="mn">Mn</option>
<option value="simn">Si-Mn</option>
<option value="feo">FeO</option>
<option value="ramming">Ramming Mass</option>
<option value="tap">Tapping AI</option>
</select>
</div>

<!-- ================= FURNACE ================= -->
<div id="furnace" class="card">

<h3>🔥 Furnace Metal</h3>

<input id="scrap" placeholder="Scrap %">
<input id="sponge" placeholder="Sponge %">
<input id="scrapY" placeholder="Scrap Yield %">
<input id="spongeY" placeholder="Sponge Yield %">
<input id="fill" placeholder="Fill %">
<input id="density" placeholder="Density">
<input id="vol" placeholder="Volume">
<input id="loss" placeholder="Loss %">
<input id="eff" placeholder="Efficiency %">
<input id="lastHeat" placeholder="Last Heat (kg)">

<button onclick="calcFurnace()">Calculate</button>

<div id="furnaceOut" class="result"></div>
<div id="furnaceSug" class="result"></div>

</div>

<!-- ================= CARBON ================= -->
<div id="carbon" class="card" style="display:none;">

<h3>🔥 Carbon Control</h3>

<select id="cMode">
<option value="up">Carbon UP</option>
<option value="down">Carbon DOWN</option>
</select>

<input id="metal" placeholder="Metal kg">
<input id="cNow" placeholder="Current C %">
<input id="cTarget" placeholder="Target C %">
<input id="cMat" placeholder="C % in CI">
<input id="feoVal" placeholder="FeO % (for down)">

<button onclick="calcCarbon()">Calculate</button>

<div id="cOut" class="result"></div>

</div>

<!-- ================= MN ================= -->
<div id="mn" class="card" style="display:none;">

<h3>⚙ Mn Calculator</h3>

<input id="mnMetal" placeholder="Metal kg">
<input id="mnNow" placeholder="Current Mn %">
<input id="mnTarget" placeholder="Target Mn %">
<input id="mnAlloy" placeholder="Mn % in alloy">
<input id="mnRec" placeholder="Recovery %">

<button onclick="calcMn()">Calculate</button>

<div id="mnOut" class="result"></div>

</div>

<!-- ================= SIMN ================= -->
<div id="simn" class="card" style="display:none;">

<h3>⚡ Si-Mn</h3>

<input id="simnMetal" placeholder="Metal kg">
<input id="simnNow" placeholder="Current Mn %">
<input id="simnTarget" placeholder="Target Mn %">
<input id="simnAlloy" placeholder="Alloy Mn %">
<input id="simnRec" placeholder="Recovery %">

<button onclick="calcSimn()">Calculate</button>

<div id="simnOut" class="result"></div>

</div>

<!-- ================= FEO ================= -->
<div id="feo" class="card" style="display:none;">

<h3>🧪 FeO</h3>

<input id="fet" placeholder="Fe Total %">
<input id="fem" placeholder="Fe(M) %">

<button onclick="calcFeo()">Calculate</button>

<div id="feoOut" class="result"></div>

</div>

<!-- ================= RAMMING ================= -->
<div id="ramming" class="card" style="display:none;">

<h3>🧱 Ramming Mass</h3>

<input id="dia" placeholder="Diameter (m)">
<input id="height" placeholder="Height (m)">
<input id="thick" placeholder="Thickness (m)">

<button onclick="calcRamming()">Calculate</button>

<div id="ramOut" class="result"></div>

</div>

<!-- ================= TAPPING ================= -->
<div id="tap" class="card" style="display:none;">

<h3>🤖 Tapping AI</h3>

<select id="grade">
<option>Fe500</option>
<option>Fe500D</option>
<option>E250</option>
<option>XLS</option>
</select>

<input id="c" placeholder="C %">
<input id="mnT" placeholder="Mn %">
<input id="s" placeholder="S %">
<input id="p" placeholder="P %">
<input id="si" placeholder="Si %">
<input id="cr" placeholder="Cr %">
<input id="cu" placeholder="Cu %">
<input id="ni" placeholder="Ni %">

<button onclick="calcTap()">Check</button>

<div id="tapOut" class="result"></div>

</div>

<script>

// maintenance auto hide
let today = new Date();
let end = new Date("2026-04-10");

if(today <= end){
document.getElementById("maint").innerHTML="⚠ App under maintenance till 10 April";
}else{
document.getElementById("maint").style.display="none";
}

// switch
function showTool(){
let t = tool.value;
["furnace","carbon","mn","simn","feo","ramming","tap"].forEach(id=>{
document.getElementById(id).style.display="none";
});
document.getElementById(t).style.display="block";
}

// furnace
function calcFurnace(){
let volVal = parseFloat(vol.value)||10;
let densityVal = parseFloat(density.value)||7.5;
let effVal = parseFloat(eff.value)||90;

let metal = volVal * densityVal * (effVal/100);

furnaceOut.innerHTML="🔥 "+metal.toFixed(2)+" Ton";

if(effVal<85){
furnaceSug.innerHTML="⚠ Low efficiency – check slag";
}else{
furnaceSug.innerHTML="✅ Stable heat";
}
}

// carbon
function calcCarbon(){
let m = +metal.value;
let now = +cNow.value;
let target = +cTarget.value;

if(cMode.value=="up"){
let mat = +cMat.value;
let kg = ((target-now)/100)*m/(mat/100);
cOut.innerHTML="⬆ Add "+kg.toFixed(1)+" kg CI";
}else{
let feo = +feoVal.value||10;
let kg = ((now-target)/100)*m*6/feo;
cOut.innerHTML="⬇ Add "+kg.toFixed(1)+" kg Sponge";
}
}

// mn
function calcMn(){
let m=+mnMetal.value;
let now=+mnNow.value;
let target=+mnTarget.value;
let alloy=+mnAlloy.value;
let rec=+mnRec.value;

let kg=((target-now)/100*m)/((alloy/100)*(rec/100));

mnOut.innerHTML="Add "+kg.toFixed(1)+" kg Mn alloy";
}

// simn
function calcSimn(){
let m=+simnMetal.value;
let now=+simnNow.value;
let target=+simnTarget.value;
let alloy=+simnAlloy.value;
let rec=+simnRec.value;

let kg=((target-now)/100*m)/((alloy/100)*(rec/100));

simnOut.innerHTML="Add "+kg.toFixed(1)+" kg Si-Mn";
}

// feo
function calcFeo(){
let feo=(fet.value-fem.value)/0.777;
feoOut.innerHTML="FeO ≈ "+feo.toFixed(2)+"%";
}

// ramming
function calcRamming(){
let d=+dia.value;
let h=+height.value;
let t=+thick.value;

let vol=3.14*d*h*t;
let kg=vol*2600;

ramOut.innerHTML="🧱 "+kg.toFixed(0)+" kg";
}

// tapping
function calcTap(){
let crv=+cr.value, cuv=+cu.value, niv=+ni.value;

if(grade.value=="XLS"){
let sum=crv+cuv+niv;
if(crv<=0.25 && cuv<=0.25 && niv<=0.25 && sum<=0.7){
tapOut.innerHTML="🟢 XLS OK – Ready to Tap";
}else{
tapOut.innerHTML="🔴 Not XLS – adjust alloy";
}
}else{
tapOut.innerHTML="🟢 Grade OK";
}
}

</script>

</body>
  </html>
