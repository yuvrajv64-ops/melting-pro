<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeltingPro Smart Melt AI ULTRA</title>

<style>
body{
margin:0;
font-family:sans-serif;
background:linear-gradient(180deg,#07121f,#0b1b2b);
color:white;
}

.header{
text-align:center;
padding:15px;
font-size:22px;
font-weight:bold;
color:#ff7a00;
}

.card{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
margin:12px;
padding:15px;
border-radius:14px;
box-shadow:0 0 15px rgba(0,0,0,0.4);
}

input,select,textarea{
width:100%;
padding:12px;
margin:6px 0;
border:none;
border-radius:10px;
background:#0b1b2b;
color:white;
}

button{
width:100%;
padding:13px;
background:#ff7a00;
border:none;
border-radius:10px;
color:white;
font-weight:bold;
}

.result{
margin-top:10px;
padding:12px;
background:#07121f;
border-radius:10px;
}

</style>
</head>

<body>

<div class="header">🔥 MeltingPro Smart Melt AI ULTRA</div>

<!-- UNIT -->
<div class="card">
<select id="unit">
<option value="inch">Inch</option>
<option value="mm">MM</option>
<option value="cm">CM</option>
<option value="m">Meter</option>
</select>
</div>

<!-- FURNACE -->
<div class="card">
<h3>🔥 Furnace Metal Calculator</h3>
<input id="top" placeholder="Top Dia">
<input id="bottom" placeholder="Bottom Dia">
<input id="height" placeholder="Height">
<input id="density" placeholder="Density (7.8)">
<button onclick="metal()">Calculate</button>
<div id="mres" class="result"></div>
</div>

<!-- RAMMING -->
<div class="card">
<h3>🧱 Ramming Mass</h3>
<input id="od" placeholder="Outer Dia">
<input id="id" placeholder="Inner Dia">
<input id="rh" placeholder="Height">
<input id="rho" placeholder="Density (2600)">
<button onclick="ram()">Calculate</button>
<div id="rres" class="result"></div>
</div>

<!-- CARBON -->
<div class="card">
<h3>🔥 Carbon Control</h3>
<select id="mode">
<option value="up">UP</option>
<option value="down">DOWN</option>
</select>

<input id="metalKg" placeholder="Metal kg">
<input id="cNow" placeholder="Current C%">
<input id="cTar" placeholder="Target C%">
<input id="ci" placeholder="C% in CI">
<input id="feo" placeholder="FeO% (for DOWN)">
<button onclick="carbon()">Calculate</button>
<div id="cres" class="result"></div>
</div>

<!-- SI-MN -->
<div class="card">
<h3>⚡ Si-Mn Calculator</h3>
<input id="heat" placeholder="Heat kg">
<input id="mn1" placeholder="Current Mn%">
<input id="mn2" placeholder="Target Mn%">
<input id="mnAlloy" placeholder="Alloy Mn%">
<input id="rec" placeholder="Recovery%">
<button onclick="simn()">Calculate</button>
<div id="simnRes" class="result"></div>
</div>

<!-- SPECTRO AI -->
<div class="card">
<h3>🤖 Spectro AI</h3>
<textarea id="spec" placeholder="Paste spectro report"></textarea>
<button onclick="analyze()">Analyze</button>
<div id="ai" class="result"></div>
</div>

<!-- SLAG AI -->
<div class="card">
<h3>🔥 Slag Prediction AI</h3>
<button onclick="slag()">Predict</button>
<div id="slagRes" class="result"></div>
</div>

<script>

// UNIT
function u(x){
let v=+x||0;
let unit=document.getElementById("unit").value;
if(unit=="inch") return v*0.0254;
if(unit=="mm") return v/1000;
if(unit=="cm") return v/100;
return v;
}

// FURNACE FIXED
function metal(){
let t=u(top.value), b=u(bottom.value), h=u(height.value);
let d=+density.value||7.8;

if(!t||!b||!h){mres.innerHTML="⚠ Fill inputs";return;}

let vol=(Math.PI*h/12)*(t*t+t*b+b*b);
let ton=vol*d;

mres.innerHTML="🔥 "+ton.toFixed(2)+" Ton";
}

// RAMMING FIX
function ram(){
let OD=u(od.value), ID=u(id.value), H=u(rh.value);
let rho=+document.getElementById("rho").value||2600;

let vol=Math.PI*(OD*OD-ID*ID)/4*H;
let kg=vol*rho;

rres.innerHTML="🧱 "+kg.toFixed(0)+" kg";
}

// CARBON FIX
function carbon(){
let m=+metalKg.value||0;
let c=+cNow.value||0;
let t=+cTar.value||0;

if(mode.value=="up"){
let ciP=+ci.value||0;
let add=((t-c)*m)/(ciP/100);
cres.innerHTML="↑ "+add.toFixed(1)+" kg CI";
}else{
let feoP=+feo.value||1;
let add=((c-t)*m*6)/feoP;
cres.innerHTML="↓ "+add.toFixed(1)+" kg Sponge";
}
}

// SIMN
function simn(){
let w=+heat.value||0;
let c=+mn1.value||0;
let t=+mn2.value||0;
let a=+mnAlloy.value||0;
let r=+rec.value||100;

let req=((t-c)*w)/(a/100)/(r/100);
simnRes.innerHTML="⚡ "+req.toFixed(1)+" kg";
}

// AI
function analyze(){
let txt=spec.value.toLowerCase();
let out="Grade: ";

if(txt.includes("c-0.2")) out+="Fe500<br>";
else if(txt.includes("s-0.04")) out+="Fe500D<br>";
else if(txt.includes("c-0.15")) out+="E250<br>";
else out+="XLS<br>";

if(txt.includes("al 0.02")) out+="⚠ Nozzle choke<br>";
if(txt.includes("p-0.05")) out+="⚠ High P<br>";

ai.innerHTML=out;
}

// SLAG AI
function slag(){
let txt=spec.value.toLowerCase();
let msg="";

if(txt.includes("feo")) msg+="⚠ High FeO → Metal loss<br>";
if(txt.includes("sio2")) msg+="⚠ Slag viscous<br>";
if(msg=="") msg="✔ Slag Normal";

slagRes.innerHTML=msg;
}

</script>

</body>
</html>
