<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeltingPro Final AI</title><style>
body{margin:0;font-family:Arial;background:#0f172a;color:#e5e7eb;}
header{background:#020617;padding:15px;text-align:center;color:#f97316;font-weight:bold;}
.tabs{display:flex;background:#1e293b;}
.tabs button{flex:1;padding:12px;background:#1e293b;border:none;color:#ccc;font-weight:bold;}
.tabs button.active{background:#f97316;color:#000;}
.section{display:none;padding:15px;}
.section.active{display:block;}
.card{background:#111827;padding:12px;border-radius:10px;margin-top:12px;}
input,select{width:100%;padding:10px;margin:6px 0;background:#1e293b;border:none;color:#fff;border-radius:6px;}
button{background:#f97316;border:none;padding:10px;width:100%;border-radius:8px;font-weight:bold;}
.result{margin-top:10px;padding:10px;background:#1e293b;border-left:4px solid #f97316;}
</style></head><body><header>🔥 MeltingPro – Smart Furnace AI</header><div class="tabs">
<button class="active" onclick="showTab(0)">Dashboard</button>
<button onclick="showTab(1)">Analyzer</button>
<button onclick="showTab(2)">Lab</button>
</div><!-- DASHBOARD --><div class="section active"><div class="card">
<h3>♻ Scrap Planning AI</h3><input id="bath" value="14" placeholder="Total Heat (ton)"><select id="grade">
<option value="Fe500">Fe500</option>
<option value="Fe500D">Fe500D</option>
<option value="E250BR">E250BR</option>
<option value="Fe500XLS">Fe500 XLS</option>
</select><h4>Current Bath</h4>
<input id="bMn" placeholder="Mn %">
<input id="bSi" placeholder="Si %">
<input id="bP" placeholder="P %"><h4>Scrap Composition</h4>
<input id="sMn" placeholder="Scrap Mn %">
<input id="sSi" placeholder="Scrap Si %">
<input id="sP" placeholder="Scrap P %"><button onclick="scrapAI()">🔥 Calculate Scrap Mix</button>

<div id="scrapOut" class="result"></div>
</div></div><!-- ANALYZER --><div class="section"><div class="card">
<h3>🧠 Furnace AI Control</h3><input id="feo" placeholder="FeO %">
<input id="temp" placeholder="Temp °C">
<input id="cao" placeholder="CaO %">
<input id="sio2" placeholder="SiO2 %"><button onclick="runAnalysis()">🔥 Full Analysis</button>

<div id="aiOut" class="result"></div></div></div><!-- LAB --><div class="section">
<div class="card">
<h3>🧪 Lab Methods</h3>
<p>All BIS testing methods included</p>
</div>
</div><script>

// TAB
function showTab(n){
let t=document.querySelectorAll(".tabs button");
let s=document.querySelectorAll(".section");
t.forEach(x=>x.classList.remove("active"));
s.forEach(x=>x.classList.remove("active"));
t[n].classList.add("active");
s[n].classList.add("active");
}

// SCRAP AI
function scrapAI(){

try{

let bath=parseFloat(document.getElementById("bath").value)||14;

let Mn=parseFloat(document.getElementById("bMn").value)||0;
let Si=parseFloat(document.getElementById("bSi").value)||0;
let P=parseFloat(document.getElementById("bP").value)||0;

let sMn=parseFloat(document.getElementById("sMn").value)||0;

let grade=document.getElementById("grade").value;

// TARGET
let tMn=0.6, tSi=0.2, tP=0.04;

if(grade==="E250BR"){
tMn=0.5; tSi=0.15;
}

// VALIDATION
if(sMn<=0){
scrapOut.innerHTML="❌ Enter scrap Mn %";
return;
}

// CALC
let reqMn=(tMn-Mn)*bath;
let scrapTon=reqMn/sMn;

scrapTon=Math.max(0,Math.min(scrapTon,5));

let msg="<b>🎯 Scrap Plan:</b><br>";
msg+="Use Scrap: "+scrapTon.toFixed(2)+" ton<br>";
msg+="Remaining: "+(bath-scrapTon).toFixed(2)+" ton<br>";

if(P>tP){
msg+="❌ High P → Use sponge<br>";
}

if(Si<tSi){
msg+="➕ Add high-Si scrap<br>";
}

scrapOut.innerHTML=msg;

}catch(e){
scrapOut.innerHTML="❌ Error in scrap calc";
}
}

// ANALYZER
function runAnalysis(){

try{

let feo=parseFloat(document.getElementById("feo").value)||0;
let temp=parseFloat(document.getElementById("temp").value)||0;
let cao=parseFloat(document.getElementById("cao").value)||0;
let sio2=parseFloat(document.getElementById("sio2").value)||0;

let rec=90-(1.5*feo);

if(temp>1700) rec-=10;
else if(temp>1670) rec-=6;

if(cao && sio2){
let b=cao/sio2;
if(b<1.8) rec-=5;
else if(b>2.5) rec+=2;
}

rec=Math.max(50,Math.min(85,rec));

let msg="⚙ Recovery: "+rec.toFixed(1)+"%<br>";

if(feo>15){
msg+="🔴 High FeO<br>";
msg+="➕ Remix77 add<br>";
msg+="⏱ Slag remove<br>";
msg+="⚠ FeSi avoid<br>";
}

if(feo<10){
msg+="🟢 Best for SiMn<br>";
}

if(temp>1670){
msg+="🌡 Reduce temperature<br>";
}

aiOut.innerHTML=msg;

}catch(e){
aiOut.innerHTML="❌ Error in analysis";
}
}

</script></body>
</html>
