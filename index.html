<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeltingPro FINAL</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#fff;}
header{background:#020617;padding:12px;text-align:center;color:#f97316;font-weight:bold;}
.tabs{display:flex;background:#1e293b;}
.tabs button{flex:1;padding:12px;border:none;background:#1e293b;color:#ccc;}
.tabs button.active{background:#f97316;color:#000;}
.section{display:none;padding:15px;}
.section.active{display:block;}
.card{background:#111827;padding:12px;margin-top:10px;border-radius:10px;}
input,select{width:100%;padding:10px;margin:5px 0;background:#1e293b;color:#fff;border:none;}
button{width:100%;padding:10px;background:#f97316;border:none;margin-top:5px;}
.result{margin-top:10px;background:#1e293b;padding:10px;}
</style>
</head>

<body>

<header><div id="maintBanner" style="display:none;background:#f97316;color:#000;padding:10px;text-align:center;font-weight:bold;">
🔧 Maintenance Update: App will be available by 10 April
</div>
  🔥 MeltingPro FINAL</header>

<div class="tabs">
<button class="active" onclick="tab(0)">Dashboard</button>
<button onclick="tab(1)">Final AI</button>
<button onclick="tab(2)">Lab</button>
</div>

<!-- DASHBOARD -->
<div class="section active">

<div class="card">
<h3>🔥 Molten Metal Calculator</h3>

<select id="mode">
<option value="furnace">Furnace</option>
<option value="ladle">Ladle</option>
</select>

<div id="mixBox">
<input id="scrapPct" placeholder="Scrap %">
<input id="spongePct" placeholder="Sponge %">
<input id="scrapYield" value="90" placeholder="Scrap Yield %">
<input id="spongeYield" value="78" placeholder="Sponge Yield %">
<input id="fillPct" value="92" placeholder="Fill %">
</div>

<div id="furnaceBox">
<input id="topDia" placeholder="Top Dia (inch)">
<input id="bottomDia" placeholder="Bottom Dia (inch)">
<input id="taper" placeholder="Taper Height (inch)">
<input id="height" placeholder="Total Height (inch)">
</div>

<div id="ladleBox" style="display:none;">
<input id="ladleDia" placeholder="Ladle Dia (inch)">
<input id="ladleHeight" placeholder="Height (inch)">
</div>

<input id="lastHeat" placeholder="Last Heat (kg) OPTIONAL">

<button onclick="calcMetal()">Calculate</button>
<div id="output" class="result"></div>

</div>

<!-- RAM -->
<h3>🧱 Ramming</h3>
<input id="shellDia" placeholder="Shell Dia">
<button onclick="calcRamming()">Calculate</button>
<div id="ramOut" class="result"></div>

<!-- MN -->
<div class="card">
<h3>⚙ Mn</h3>
<input id="mnMetal" placeholder="Metal ton">
<input id="curMn" placeholder="Current Mn">
<input id="tarMn" placeholder="Target Mn">
<input id="rec" placeholder="Recovery %">
<input id="allMn" placeholder="Alloy %">
<button onclick="calcMn()">Calculate</button>
<div id="mnOut" class="result"></div>
</div>

<!-- CARBON -->
<div class="card">
<h3>⚡ Carbon</h3>

<select id="carbonMode" onchange="toggleC()">
<option value="down">Down</option>
<option value="up">Up</option>
</select>

<div id="cd">
<input id="cMetal" placeholder="Metal">
<input id="cCur" placeholder="Current C">
<input id="cTar" placeholder="Target C">
<input id="feo" placeholder="FeO">
</div>

<div id="cu" style="display:none;">
<input id="cMetalUp" placeholder="Metal">
<input id="cCurUp" placeholder="Current C">
<input id="cTarUp" placeholder="Target C">
<input id="ciPct" placeholder="CI %">
</div>

<button onclick="calcCarbon()">Calculate</button>
<div id="cOut" class="result"></div>

</div>

</div>

<script>

// TOGGLE
document.getElementById("mode").addEventListener("change", function(){

if(this.value === "furnace"){
furnaceBox.style.display="block";
ladleBox.style.display="none";
mixBox.style.display="block";
}else{
furnaceBox.style.display="none";
ladleBox.style.display="block";
mixBox.style.display="none";
}

});

// MAIN CALC
function calcMetal(){

let output = document.getElementById("output");
let modeVal = document.getElementById("mode").value;

let fillPct = parseFloat(document.getElementById("fillPct").value) || 92;
let density = 7450;

// FURNACE
if(modeVal === "furnace"){

let scrapPct = parseFloat(document.getElementById("scrapPct").value)||0;
let spongePct = parseFloat(document.getElementById("spongePct").value)||0;

if((scrapPct+spongePct)!==100){
output.innerHTML="❌ Scrap+Sponge=100%";
return;
}

let scrapYield = parseFloat(document.getElementById("scrapYield").value)||90;
let spongeYield = parseFloat(document.getElementById("spongeYield").value)||78;

let totalYield=((scrapPct*scrapYield)+(spongePct*spongeYield))/100;
let yieldFactor=totalYield/100;

let top=parseFloat(document.getElementById("topDia").value);
let bottom=parseFloat(document.getElementById("bottomDia").value);
let taper=parseFloat(document.getElementById("taper").value);
let height=parseFloat(document.getElementById("height").value);

if(isNaN(top)||isNaN(bottom)||isNaN(taper)||isNaN(height)){
output.innerHTML="❌ Enter furnace values";
return;
}

top*=0.0254;bottom*=0.0254;taper*=0.0254;height*=0.0254;

let r1=top/2;
let r2=bottom/2;

let v1=(Math.PI*taper/3)*(r1*r1+r2*r2+r1*r2);
let v2=Math.PI*r2*r2*(height-taper);

let volume=(v1+v2)*(fillPct/100);
let theoretical=(volume*density)/1000;
let practical=theoretical*yieldFactor;

// AUTO LEARNING
let lastHeat=parseFloat(document.getElementById("lastHeat").value);
let learnFactor=parseFloat(localStorage.getItem("learnFactor"))||1;

if(!isNaN(lastHeat)&&lastHeat>0){
let actualTon=lastHeat/1000;
learnFactor=actualTon/practical;
localStorage.setItem("learnFactor",learnFactor);
}

let finalTon=practical*learnFactor;

output.innerHTML=
"🔥 "+finalTon.toFixed(2)+" Ton ("+(finalTon*1000).toFixed(0)+" kg)<br>"+
"📊 Yield: "+totalYield.toFixed(1)+"%<br>"+
"🧠 Learn: "+learnFactor.toFixed(3);
}

// LADLE
else{

let dia=parseFloat(document.getElementById("ladleDia").value);
let h=parseFloat(document.getElementById("ladleHeight").value);

if(isNaN(dia)||isNaN(h)){
output.innerHTML="❌ Enter ladle values";
return;
}

dia*=0.0254;h*=0.0254;

let r=dia/2;
let volume=Math.PI*r*r*h*(fillPct/100);
let theoretical=(volume*density)/1000;

// AUTO LEARNING
let lastHeat=parseFloat(document.getElementById("lastHeat").value);
let learnFactor=parseFloat(localStorage.getItem("learnFactor"))||1;

if(!isNaN(lastHeat)&&lastHeat>0){
let actualTon=lastHeat/1000;
learnFactor=actualTon/theoretical;
localStorage.setItem("learnFactor",learnFactor);
}

let finalTon=theoretical*learnFactor;

output.innerHTML=
"🪣 "+finalTon.toFixed(2)+" Ton ("+(finalTon*1000).toFixed(0)+" kg)<br>"+
"🧠 Learn: "+learnFactor.toFixed(3);
}

}

// RAM
function calcRamming(){
let s=parseFloat(shellDia.value)||0;
ramOut.innerHTML="🧱 "+(s*s/500).toFixed(2)+" Ton";
}

// MN
function calcMn(){
let m=mnMetal.value||0;
let need=m*(tarMn.value-curMn.value)*10;
let alloy=need/(allMn.value/100)/(rec.value/100);
mnOut.innerHTML="⚙ "+alloy.toFixed(1)+" kg";
}

// CARBON
function toggleC(){
let m=document.getElementById("carbonMode").value;
cd.style.display=(m==="up")?"none":"block";
cu.style.display=(m==="up")?"block":"none";
}

function calcCarbon(){
let m=document.getElementById("carbonMode").value;

if(m==="down"){
let kg=(cMetal.value*(cCur.value-cTar.value)*6)/feo.value;
cOut.innerHTML="⬇ "+kg.toFixed(1)+" kg";
}else{
let kg=(cMetalUp.value*(cTarUp.value-cCurUp.value)/100)/(ciPct.value/100);
cOut.innerHTML="⬆ "+kg.toFixed(1)+" kg";
}
}
// 🔥 Maintenance System

window.onload = function(){

let today = new Date();
let endDate = new Date("2026-04-10"); // 🔥 change date here

// ===== SHOW BANNER =====
if(today <= endDate){
    document.getElementById("maintBanner").style.display = "block";
}

// ===== POPUP (once per day) =====
let lastShown = localStorage.getItem("popupDate");
let todayStr = today.toDateString();

if(today <= endDate && lastShown !== todayStr){

    setTimeout(()=>{
        alert("🔧 Maintenance Update\n\nApp is under maintenance.\nAvailable by 10 April.\n\nThank you for your patience.");
    }, 500);

    localStorage.setItem("popupDate", todayStr);
}

   }
</script>

</body>
</html>
