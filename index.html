<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeltingPro FINAL DEBUG</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#fff;}
header{background:#020617;padding:12px;text-align:center;color:#f97316;font-weight:bold;}
.card{background:#111827;padding:12px;margin:10px;border-radius:10px;}
input{width:100%;padding:10px;margin:5px 0;background:#1e293b;color:#fff;border:none;}
button{width:100%;padding:12px;background:#f97316;color:#000;border:none;margin-top:10px;}
.result{background:#1e293b;padding:10px;margin-top:10px;}
.banner{background:#f97316;color:#000;text-align:center;padding:8px;font-weight:bold;}
</style>

</head>

<body>

<div id="maint" class="banner">⚠ App under maintenance till 10 April</div>

<header>🔥 MeltingPro FINAL DEBUG</header>

<div class="card">
<h3>🔥 Furnace Calculator</h3>

<input id="scrapPct" placeholder="Scrap %">
<input id="spongePct" placeholder="Sponge %">

<input id="scrapYield" placeholder="Scrap Yield %" value="90">
<input id="spongeYield" placeholder="Sponge Yield %" value="78">

<input id="fillPct" placeholder="Fill %" value="92">

<input id="topDia" placeholder="Top Dia (inch)">
<input id="bottomDia" placeholder="Bottom Dia (inch)">
<input id="taper" placeholder="Taper Height (inch)">
<input id="height" placeholder="Total Height (inch)">

<input id="lastHeat" placeholder="Last Heat (kg) OPTIONAL">

<button id="calcBtn">Calculate</button>

<div id="output" class="result"></div>
<div id="aiSuggestion" class="result"></div>
<div id="debug" class="result"></div>

</div>

<div class="card">
<h3>⚙ Mn Calculator</h3>
<input id="mnMetal" placeholder="Metal (Ton)">
<input id="mnCurrent" placeholder="Current Mn %">
<input id="mnTarget" placeholder="Target Mn %">
<button onclick="calcMn()">Calculate Mn</button>
<div id="mnResult" class="result"></div>
</div>

<div class="card">
<h3>⚡ Carbon Calculator</h3>
<input id="cMetal" placeholder="Metal (Ton)">
<input id="cCurrent" placeholder="Current C %">
<input id="cTarget" placeholder="Target C %">
<button onclick="calcCarbon()">Calculate Carbon</button>
<div id="cResult" class="result"></div>
</div>

<script>

// 🔥 BUTTON BIND FIX
document.getElementById("calcBtn").addEventListener("click", calcMetal);

// 🔥 MAIN CALC (SAFE)
function calcMetal(){

try{

let debug = document.getElementById("debug");
debug.innerHTML = "Running...";

// SAFE INPUT FETCH
let scrap = parseFloat(document.getElementById("scrapPct").value) || 0;
let sponge = parseFloat(document.getElementById("spongePct").value) || 0;

let scrapY = parseFloat(document.getElementById("scrapYield").value) || 90;
let spongeY = parseFloat(document.getElementById("spongeYield").value) || 78;

let fill = parseFloat(document.getElementById("fillPct").value) || 92;

let top = parseFloat(document.getElementById("topDia").value);
let bottom = parseFloat(document.getElementById("bottomDia").value);
let taper = parseFloat(document.getElementById("taper").value);
let height = parseFloat(document.getElementById("height").value);

let last = parseFloat(document.getElementById("lastHeat").value);

let output = document.getElementById("output");

// VALIDATION
if((scrap + sponge) != 100){
output.innerHTML="❌ Scrap + Sponge must = 100%";
return;
}

if(isNaN(top)||isNaN(bottom)||isNaN(taper)||isNaN(height)){
output.innerHTML="❌ Enter furnace values";
return;
}

// CALC
top*=0.0254; bottom*=0.0254; taper*=0.0254; height*=0.0254;

let r1=top/2, r2=bottom/2;

let v1=(Math.PI*taper/3)*(r1*r1+r2*r2+r1*r2);
let v2=Math.PI*r2*r2*(height-taper);

let volume=(v1+v2)*(fill/100);

let density=7450;
let theoretical=(volume*density)/1000;

let totalYield=((scrap*scrapY)+(sponge*spongeY))/100;
let practical=theoretical*(totalYield/100);

// AUTO LEARN
let learn=parseFloat(localStorage.getItem("furnaceLearn"))||1;

if(!isNaN(last)&&last>0){
learn=(last/1000)/practical;
localStorage.setItem("furnaceLearn",learn);
}

let final=practical*learn;

// OUTPUT
output.innerHTML=
"📐 Theoretical: "+theoretical.toFixed(2)+" Ton<br>"+
"🔥 After Yield: "+practical.toFixed(2)+" Ton<br>"+
"🚀 Final: "+final.toFixed(2)+" Ton<br>"+
"📊 Yield: "+totalYield.toFixed(1)+"%<br>"+
"🧠 Learn: "+learn.toFixed(3);

// AI CALL
smartAI(totalYield, scrap, sponge);

// DEBUG
debug.innerHTML="✅ Success";

}catch(err){
document.getElementById("debug").innerHTML="❌ Error: "+err.message;
}

}

// 🤖 AI
function smartAI(yieldVal, scrap, sponge){

let msg="";

if(yieldVal<88){
msg+="🔴 Low Yield → Increase scrap<br>";
}
else if(yieldVal<92){
msg+="🟡 Normal Yield<br>";
}
else{
msg+="🟢 High Yield<br>";
}

if(sponge>45){
msg+="⚠ High Sponge → Slag ↑<br>";
}

document.getElementById("aiSuggestion").innerHTML=msg;
}

// ⚙ Mn
function calcMn(){
let metal=parseFloat(document.getElementById("mnMetal").value)||0;
let current=parseFloat(document.getElementById("mnCurrent").value)||0;
let target=parseFloat(document.getElementById("mnTarget").value)||0;

let req=((target-current)/100)*metal*1000;

document.getElementById("mnResult").innerHTML=
"⚙ Mn Required: "+req.toFixed(1)+" kg";
}

// ⚡ Carbon
function calcCarbon(){
let metal=parseFloat(document.getElementById("cMetal").value)||0;
let current=parseFloat(document.getElementById("cCurrent").value)||0;
let target=parseFloat(document.getElementById("cTarget").value)||0;

let req=((target-current)/100)*metal*1000;

document.getElementById("cResult").innerHTML=
"⚡ Carbon Required: "+req.toFixed(1)+" kg";
}

// ⏳ MAINT AUTO REMOVE
let today=new Date();
let lastDate=new Date("2026-04-10");

if(today>lastDate){
document.getElementById("maint").style.display="none";
}

</script>

</body>
</html>
