<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#081421,#0d2236);
color:white;
}

/* HEADER */
.header{
text-align:center;
padding:15px;
font-size:22px;
font-weight:bold;
color:#ff7a00;
}

/* CARD */
.card{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
padding:15px;
margin:12px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,0.5);
}

/* INPUT */
input,select{
width:100%;
padding:12px;
margin:6px 0;
border:none;
border-radius:10px;
background:#0b1b2b;
color:white;
}

/* BUTTON */
button{
width:100%;
padding:12px;
background:#ff7a00;
border:none;
border-radius:10px;
color:white;
font-weight:bold;
margin-top:10px;
}

/* RESULT */
.result{
margin-top:10px;
padding:10px;
background:#05101c;
border-radius:10px;
}

/* NAV */
.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
}

.nav button{
flex:1;
}

.page{display:none;}
.active{display:block;}

</style>
</head>

<body>

<div class="header">🔥 MeltingPro AI (Pro)</div>

<!-- PAGE 1 -->
<div id="p1" class="page active">

<div class="card">
<h3>🔥 Furnace Metal</h3>

<input id="top" placeholder="Top Dia">
<input id="bottom" placeholder="Bottom Dia">
<input id="height" placeholder="Height">

<input id="scrapP" placeholder="Scrap %">
<input id="spongeP" placeholder="Sponge %">

<input id="scrapY" placeholder="Scrap Yield %">
<input id="spongeY" placeholder="Sponge Yield %">

<input id="fill" placeholder="Fill % (default 90)">
<input id="prev" placeholder="Previous Heat Metal">

<button onclick="calcFurnace()">Calculate</button>

<div id="furnaceRes" class="result"></div>

</div>

<div class="card">
<h3>🔥 Carbon AI</h3>

<select id="mode">
<option value="up">UP (CI)</option>
<option value="down">DOWN (FeO)</option>
</select>

<input id="metal" placeholder="Metal (kg)">
<input id="c1" placeholder="Current C%">
<input id="c2" placeholder="Target C%">

<input id="ci" placeholder="CI %">
<input id="feo" placeholder="FeO %">

<button onclick="calcCarbon()">Calculate</button>

<div id="carbonRes" class="result"></div>

</div>

</div>

<!-- PAGE 2 -->
<div id="p2" class="page">

<div class="card">
<h3>⚡ Mn AI</h3>

<input id="heat" placeholder="Heat kg">
<input id="mn1" placeholder="Current Mn%">
<input id="mn2" placeholder="Target Mn%">
<input id="alloy" placeholder="Alloy Mn%">
<input id="rec" placeholder="Recovery %">

<button onclick="calcMn()">Calculate</button>

<div id="mnRes" class="result"></div>
<div id="mnAI" class="result"></div>

</div>

<div class="card">
<h3>🤖 Grade AI</h3>

<textarea id="spec" placeholder="Paste spectro"></textarea>

<button onclick="gradeAI()">Detect</button>

<div id="gradeRes" class="result"></div>

</div>

</div>

<!-- PAGE 3 -->
<div id="p3" class="page">

<div class="card">
<h3>🧪 Slag AI</h3>

<input id="cao" placeholder="CaO%">
<input id="sio2" placeholder="SiO2%">
<input id="feoS" placeholder="FeO%">

<button onclick="slagAI()">Analyze</button>

<div id="slagRes" class="result"></div>

</div>

<div class="card">
<h3>📄 Report</h3>

<textarea id="report"></textarea>

<button onclick="makeReport()">Generate</button>
<button onclick="sendWA()">📤 WhatsApp</button>

</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="show(1)">🏭</button>
<button onclick="show(2)">🤖</button>
<button onclick="show(3)">📄</button>
</div>

<script>

// PAGE SWITCH
function show(p){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById("p"+p).classList.add("active");
}

// FURNACE FIXED
function calcFurnace(){

let t=Number(top.value)||0;
let b=Number(bottom.value)||0;
let h=Number(height.value)||0;

if(!t||!b||!h){
furnaceRes.innerHTML="⚠️ Enter dimensions";
return;
}

let vol=Math.PI*h*((t/2)*(b/2));
let density=7.5;

let fillP=(Number(fill.value)||90)/100;

let yieldF=((scrapP.value*scrapY.value)+(spongeP.value*spongeY.value))/10000;

if(!yieldF) yieldF=0.9;

let ton=vol*density*fillP*yieldF;

let prevHeat=Number(prev.value)||0;
ton=(ton+prevHeat)/2;

furnaceRes.innerHTML="🔥 "+ton.toFixed(2)+" Ton";

}

// CARBON FIXED
function calcCarbon(){

let m=Number(metal.value)||0;
let cStart=Number(c1.value)||0;
let cEnd=Number(c2.value)||0;

if(!m||!cStart||!cEnd){
carbonRes.innerHTML="⚠️ Fill data";
return;
}

if(mode.value=="up"){
let ciV=Number(ci.value)||0;
if(!ciV){carbonRes.innerHTML="⚠️ CI% needed";return;}

let add=(m*(cEnd-cStart))/(ciV/100*0.8);

carbonRes.innerHTML="↑ Add "+add.toFixed(1)+" kg CI";

}else{

let feoV=Number(feo.value)||0;
if(!feoV){carbonRes.innerHTML="⚠️ FeO% needed";return;}

let red=(m*(cStart-cEnd))/(feoV/100);

carbonRes.innerHTML="↓ Use "+red.toFixed(1)+" kg Sponge";

}

}

// MN FIXED
function calcMn(){

let h=Number(heat.value)||0;
let diff=(mn2.value-mn1.value)||0;

let req=(h*diff)/((alloy.value/100)*(rec.value/100));

mnRes.innerHTML="⚡ "+req.toFixed(1)+" kg";

let msg="";
if(diff>0.3) msg+="⚠ Mn low → Increase alloy<br>";
if(diff<0.1) msg+="✔ Near target<br>";

mnAI.innerHTML=msg;

}

// GRADE AI (IMPROVED)
function gradeAI(){

let t=spec.value.toLowerCase();

let grade="XLS";

if(t.includes("0.22") && t.includes("0.6")) grade="Fe500";
if(t.includes("0.04") && t.includes("s")) grade="Fe500D";
if(t.includes("0.15") && t.includes("cu")) grade="E250Br";

gradeRes.innerHTML="🏆 "+grade;

}

// SLAG AI SMART
function slagAI(){

let b=(cao.value/sio2.value);

let msg="Basicity: "+b.toFixed(2)+"<br>";

if(b<2) msg+="➡ Add Lime (10-20 kg)<br>";
if(b>3) msg+="➡ Reduce Lime<br>";
if(feoS.value>25) msg+="➡ Add Carbon / Reduce O2<br>";

slagRes.innerHTML=msg;

}

// REPORT
function makeReport(){
report.value=
`🔥 Heat Report

${furnaceRes.innerText}
${carbonRes.innerText}
${mnRes.innerText}
${gradeRes.innerText}
${slagRes.innerText}`;
}

// WA
function sendWA(){
window.open("https://wa.me/?text="+encodeURIComponent(report.value));
}

</script>

</body>
</html>
