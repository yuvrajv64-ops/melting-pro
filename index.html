<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MeltingPro Industrial</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#0f2027,#203a43);
color:white;
}

.header{
padding:15px;
text-align:center;
background:#111;
font-size:18px;
}

.lang{
position:absolute;
right:10px;
top:10px;
cursor:pointer;
background:#ff9800;
padding:5px 10px;
border-radius:6px;
color:black;
}

.container{
padding:15px;
max-width:420px;
margin:auto;
}

.card{
background:#1b2b34;
padding:15px;
margin-bottom:20px;
border-radius:12px;
box-shadow:0 0 10px #000;
}

input,select{
width:100%;
padding:8px;
margin:6px 0;
border-radius:6px;
border:1px solid #555;
}

button{
width:100%;
padding:10px;
background:#ff9800;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.result{
margin-top:10px;
font-weight:bold;
}

.signal{
font-size:20px;
margin-top:5px;
}
</style>
</head>

<body>

<div class="header">
MeltingPro – Industrial Toolkit
<div class="lang" onclick="toggleLang()" id="langBtn">हिंदी</div>
</div>

<div class="container">

<div class="card">
<h3 id="mnTitle">Mn Addition Calculator</h3>

<label>Metal (kg)</label>
<input id="metal">

<label>Current Mn %</label>
<input id="curMn">

<label>Target Mn %</label>
<input id="tarMn">

<label>Recovery %</label>
<input id="rec">

<label>Alloy Mn %</label>
<input id="allMn">

<button onclick="calcMn()">Calculate</button>
<div id="mnOut" class="result"></div>
</div>

<div class="card">
<h3>FeO Lab Test</h3>

<label>Titre (ml)</label>
<input id="titre">

<label>Normality (N)</label>
<input id="norm">

<label>Sample Weight (g)</label>
<input id="wt">

<button onclick="calcFeO()">Calculate FeO</button>
<div id="feoOut" class="result"></div>
</div>

<div class="card">
<h3>6 Heat Avg Recovery</h3>
<input id="h1" placeholder="Heat1 Recovery%">
<input id="h2" placeholder="Heat2 Recovery%">
<input id="h3" placeholder="Heat3 Recovery%">
<input id="h4" placeholder="Heat4 Recovery%">
<input id="h5" placeholder="Heat5 Recovery%">
<input id="h6" placeholder="Heat6 Recovery%">

<button onclick="calcAvg()">Calculate Avg</button>
<div id="avgOut" class="result"></div>
</div>

<div class="card">
<h3>Recovery Explanation</h3>
<p>Max practical Mn recovery: 75–82%.</p>
<p>Rest Mn goes to slag as MnO and oxidation loss.</p>
</div>

</div>

<script>

let lang="en";

function toggleLang(){
if(lang=="en"){
lang="hi";
document.getElementById("langBtn").innerText="English";
document.getElementById("mnTitle").innerText="Mn मिलाना कैलकुलेटर";
}else{
location.reload();
}
}

function calcMn(){
let m=parseFloat(metal.value);
let c=parseFloat(curMn.value);
let t=parseFloat(tarMn.value);
let r=parseFloat(rec.value);
let a=parseFloat(allMn.value);

if(isNaN(m)||isNaN(c)||isNaN(t)||isNaN(r)||isNaN(a)){
mnOut.innerHTML="Enter all values";
return;
}

let req=(m*(t-c)/100)/(r/100);
let alloy=(req*100)/a;

mnOut.innerHTML="Add Alloy: "+alloy.toFixed(2)+" kg";
}

function calcFeO(){
let V=parseFloat(titre.value);
let N=parseFloat(norm.value);
let W=parseFloat(wt.value);

if(isNaN(V)||isNaN(N)||isNaN(W)){
feoOut.innerHTML="Enter all values";
return;
}

let feo=(V*N*7.99*100)/W;

let signal="";
if(feo>15) signal=" 🔴 High Oxidizing Slag";
else if(feo>=12) signal=" 🟡 Moderate";
else signal=" 🟢 Safe Reducing";

feoOut.innerHTML="FeO: "+feo.toFixed(2)+"%"+signal;
}

function calcAvg(){
let total=0,count=0;

for(let i=1;i<=6;i++){
let v=parseFloat(document.getElementById("h"+i).value);
if(!isNaN(v)){total+=v;count++;}
}

if(count==0){
avgOut.innerHTML="Enter at least one heat.";
return;
}

let avg=total/count;

let sig="";
if(avg>70) sig=" 🟢 Stable";
else if(avg>=60) sig=" 🟡 Moderate";
else sig=" 🔴 Unstable";

avgOut.innerHTML="Average Recovery: "+avg.toFixed(1)+"%"+sig;
}

</script>

</body>
</html>
