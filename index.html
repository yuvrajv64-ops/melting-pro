<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeltingPro</title>

<style>
body{
font-family:Arial;
margin:0;
background:linear-gradient(135deg,#0f2027,#203a43);
color:white;
text-align:center;
padding:20px;
}
.card{
background:#1e293b;
padding:20px;
margin:15px auto;
border-radius:12px;
max-width:400px;
box-shadow:0 0 15px rgba(0,0,0,0.5);
}
input,select,button{
width:90%;
padding:8px;
margin:5px;
border-radius:6px;
border:none;
}
button{
background:#22c55e;
color:white;
font-weight:bold;
cursor:pointer;
}
.signal{
font-weight:bold;
margin-top:10px;
}
</style>
</head>

<body>

<h2>🔥 MeltingPro Calculators</h2>

<div class="card">
<h3>Mn Addition Calculator</h3>
<input type="number" id="metal" placeholder="Metal Weight kg">
<input type="number" id="curMn" placeholder="Current Mn %">
<input type="number" id="tarMn" placeholder="Target Mn %">
<input type="number" id="rec" placeholder="Recovery %" value="70">
<input type="number" id="allMn" placeholder="Alloy Mn %" value="14">
<button onclick="calcMn()">Calculate</button>
<div id="mnOut"></div>
</div>

<div class="card">
<h3>Carbon Adjustment</h3>
<input type="number" id="cMetal" placeholder="Metal kg">
<input type="number" id="cCur" placeholder="Current C %">
<input type="number" id="cTar" placeholder="Target C %">
<select id="cType">
<option value="sponge">Carbon Down (Sponge)</option>
<option value="cast">Carbon Up (Cast Iron)</option>
</select>
<input type="number" id="cPct" placeholder="FeO% or C%" value="12">
<button onclick="calcCarbon()">Calculate</button>
<div id="cOut"></div>
</div>

<div class="card">
<h3>Mn Recovery Predictor</h3>
<input type="number" id="feo" placeholder="FeO %">
<input type="number" id="temp" placeholder="Bath Temp °C">
<input type="number" id="tap" placeholder="Tap Temp °C">
<button onclick="calcRecovery()">Predict</button>
<div id="recOut"></div>
</div>

<div class="card">
<h3>6 Heat Average Recovery</h3>
<input type="number" id="h1" placeholder="Heat1 Recovery %">
<input type="number" id="h2" placeholder="Heat2 Recovery %">
<input type="number" id="h3" placeholder="Heat3 Recovery %">
<input type="number" id="h4" placeholder="Heat4 Recovery %">
<input type="number" id="h5" placeholder="Heat5 Recovery %">
<input type="number" id="h6" placeholder="Heat6 Recovery %">
<button onclick="avgRec()">Average</button>
<div id="avgOut"></div>
</div>

<div class="card">
<h3>FeO Lab Test</h3>
<input type="number" id="titre" placeholder="Titre ml">
<button onclick="calcFeO()">Calculate FeO</button>
<div id="feoOut"></div>
</div>

<script>

function calcMn(){
let m=metal.value, c=curMn.value, t=tarMn.value, r=rec.value, a=allMn.value;
if(!m||!c||!t||!r||!a){mnOut.innerHTML="Enter all values";return;}
let req=(m*(t-c)/100)/(r/100);
let alloy=req*100/a;
mnOut.innerHTML="Add Alloy: "+alloy.toFixed(2)+" kg";
}

function calcCarbon(){
let m=cMetal.value, c=cCur.value, t=cTar.value, type=cType.value, pct=cPct.value;
if(!m||!c||!t||!pct){cOut.innerHTML="Enter values";return;}
let delta=t-c;
if(type=="sponge"){
let sponge=(Math.abs(delta)*m*6)/pct;
cOut.innerHTML="Add Sponge: "+sponge.toFixed(2)+" kg";
}else{
let cast=(delta*m)/(pct/100);
cOut.innerHTML="Add Cast Iron: "+cast.toFixed(2)+" kg";
}
}

function calcRecovery(){
let f=feo.value, tempv=temp.value, tapv=tap.value;
if(!f||!tempv||!tapv){recOut.innerHTML="Enter values";return;}
let rec=90-(1.5*f);
if(tempv>1620)rec-=3;
if(tapv>1670)rec-=8;
let sig="🟢 Stable";
if(rec<70)sig="🟡 Moderate";
if(rec<60)sig="🔴 High Oxidation";
recOut.innerHTML="Expected Recovery: "+rec.toFixed(1)+"%<div class='signal'>"+sig+"</div>";
}

function avgRec(){
let total=0,count=0;
for(let i=1;i<=6;i++){
let v=document.getElementById("h"+i).value;
if(v){total+=parseFloat(v);count++;}
}
if(count==0){avgOut.innerHTML="Enter data";return;}
let avg=total/count;
let sig="🟢 Stable";
if(avg<70)sig="🟡 Moderate";
if(avg<60)sig="🔴 Unstable";
avgOut.innerHTML="Average: "+avg.toFixed(1)+"%<div class='signal'>"+sig+"</div>";
}

function calcFeO(){
let v=titre.value;
if(!v){feoOut.innerHTML="Enter titre";return;}
let feo=v*1.6;
let sig="🟢 Safe";
if(feo>12)sig="🟡 Moderate";
if(feo>15)sig="🔴 High FeO";
feoOut.innerHTML="FeO: "+feo.toFixed(2)+"%<div class='signal'>"+sig+"</div>";
}

</script>

</body>
</html>
