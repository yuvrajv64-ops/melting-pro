<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeltingPro 3.0 – Furnace Intelligence</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#e5e7eb;}
header{background:#020617;padding:15px;text-align:center;color:#f97316;font-weight:bold;}
.tabs{display:flex;background:#1e293b;}
.tabs button{flex:1;padding:12px;background:#1e293b;border:none;color:#ccc;font-weight:bold;}
.tabs button.active{background:#f97316;color:#000;}
.section{display:none;padding:15px;}
.section.active{display:block;}

.card{background:#111827;padding:12px;border-radius:10px;margin-top:12px;}
input,select{width:100%;padding:10px;margin:6px 0;background:#1e293b;border:none;color:#fff;border-radius:6px;}
button{background:#f97316;border:none;padding:10px;width:100%;border-radius:8px;font-weight:bold;}
.result{margin-top:10px;padding:10px;background:#1e293b;border-left:4px solid #f97316;border-radius:6px;}
.note{font-size:12px;color:#9ca3af;}
</style>
</head>

<body>

<header>🔥 MeltingPro 3.0 – Smart Furnace</header>

<div class="tabs">
<button class="active" onclick="showTab(0)">Dashboard</button>
<button onclick="showTab(1)">Analyzer</button>
</div>

<!-- DASHBOARD -->
<div class="section active">

<div class="card">
<h3>🔥 Metal Calculator</h3>
<input id="topDia" placeholder="Top Dia">
<input id="bottomDia" placeholder="Bottom Dia">
<input id="height" placeholder="Height">
<input id="taper" placeholder="Taper">
<button onclick="calcMetal()">Calculate</button>
<div id="metalOut" class="result"></div>
<div class="note">Density 7.5 t/m³ | Fill factor 0.85</div>
</div>

<div class="card">
<h3>🧱 Ramming Mass</h3>
<input id="shellDia" placeholder="Shell Dia">
<input id="farmaDia" placeholder="Farma Dia">
<input id="totalHeight" placeholder="Height">
<button onclick="calcRamming()">Calculate</button>
<div id="ramOut" class="result"></div>
<div class="note">Density 2.7 t/m³ | +5% extra</div>
</div>

<div class="card">
<h3>Mn Input (Hidden Logic)</h3>
<input id="metal" placeholder="Metal">
<input id="curMn" placeholder="Current Mn">
<input id="tarMn" placeholder="Target Mn">
<input id="rec" placeholder="Recovery %">
<input id="allMn" placeholder="Alloy %">
<button onclick="saveMn()">Save Data</button>
</div>

</div>

<!-- ANALYZER -->
<div class="section">

<div class="card">
<h3>🧠 Furnace Analysis</h3>

<input id="feo" placeholder="FeO %">
<input id="temp" placeholder="Temp">

<select id="slag">
<option value="reducing">Reducing</option>
<option value="normal">Normal</option>
<option value="oxidizing">Oxidizing</option>
</select>

<button onclick="runAnalysis()">🔥 Full Analysis</button>

<div id="aiOut" class="result"></div>

</div>

<div class="card">
<h4>📊 Learning Data</h4>
<input id="actualRec" placeholder="Actual Recovery %">
<button onclick="saveLearning()">Save Heat</button>
</div>

</div>

<script>

// TAB
function showTab(n){
let t=document.querySelectorAll(".tabs button");
let s=document.querySelectorAll(".section");
t.forEach(x=>x.classList.remove("active"));
s.forEach(x=>x.classList.remove("active"));
t[n].classList.add("active");
s[n].classList.add("active");
}

// METAL
function calcMetal(){
let d1=topDia.value*0.0254;
let d2=bottomDia.value*0.0254;
let h1=height.value*0.0254;
let h2=taper.value*0.0254;

let v=(3.14*(d1/2)**2*h1)+(3.14*h2/3*((d1/2)**2+(d2/2)**2+(d1/2)*(d2/2)));
let ton=v*7.5;

metalOut.innerHTML="🔥 "+ton.toFixed(2)+" Ton";
}

// RAMMING
function calcRamming(){
let s=shellDia.value;
let f=farmaDia.value;
let h=totalHeight.value;

let lining=(s-f)/2;

ramOut.innerHTML="🧱 Lining: "+lining+" inch";
}

// SAVE MN
function saveMn(){
let m=metal.value;
let c=curMn.value;
let t=tarMn.value;
let r=rec.value;
let a=allMn.value;

let mn=(m*(t-c)/100)/(r/100);
let alloy=(mn*100)/a;

window.mnData={mn:mn,alloy:alloy};

alert("✅ Mn Data Saved");
}

// LEARNING SAVE
function saveLearning(){
let feoVal=feo.value;
let tempVal=temp.value;
let slagVal=slag.value;
let actual=actualRec.value;

let data=JSON.parse(localStorage.getItem("heat"))||[];

data.push({feo:feoVal,temp:tempVal,slag:slagVal,actual:actual});

localStorage.setItem("heat",JSON.stringify(data));

alert("✅ Saved");
}

// LEARNING
function learn(feo,temp,slag){
let data=JSON.parse(localStorage.getItem("heat"))||[];
let sum=0,count=0;

data.forEach(d=>{
if(Math.abs(d.feo-feo)<3 && Math.abs(d.temp-temp)<30 && d.slag==slag){
sum+=parseFloat(d.actual);
count++;
}
});

return count?sum/count:null;
}

// ANALYSIS
function runAnalysis(){

if(!window.mnData){
aiOut.innerHTML="⚠ Save Mn first";
return;
}

let feoVal=parseFloat(feo.value);
let tempVal=parseFloat(temp.value);
let slagVal=slag.value;

let rec=90-(1.5*feoVal);

if(tempVal>1700) rec-=12;
else if(tempVal>1670) rec-=8;

if(slagVal=="oxidizing") rec-=5;
if(slagVal=="reducing") rec+=3;

let learned=learn(feoVal,tempVal,slagVal);
if(learned) rec=(rec+learned)/2;

let out="🔥 Mn: "+mnData.mn.toFixed(1)+" kg<br>";
out+="⚙ Recovery: "+rec.toFixed(1)+" %<br>";
out+="🧪 Alloy: "+mnData.alloy.toFixed(1)+" kg<br><br>";

if(feoVal>15) out+="🔴 High FeO<br>";
if(tempVal>1670) out+="🔴 High Temp<br>";
if(slagVal=="oxidizing") out+="🔴 Oxidizing Slag<br>";

if(learned) out+="🤖 AI Learning Applied<br>";

out+="💡 Add Mn after slag cleaning";

aiOut.innerHTML=out;
}

</script>

</body>
</html>
