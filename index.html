<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeltingPro Smart Melt AI</title>

<style>
body{
margin:0;
font-family:sans-serif;
background:#0b1a2f;
color:#fff;
}

.header{
text-align:center;
padding:12px;
color:#ff7a00;
font-size:20px;
}

.page{
display:none;
padding-bottom:70px;
}

.active{
display:block;
}

.card{
background:#16263f;
margin:10px;
padding:15px;
border-radius:10px;
}

input,select,textarea{
width:100%;
padding:14px;
margin:6px 0;
border:none;
border-radius:6px;
background:#0f1f35;
color:white;
font-size:16px;
}

button{
width:100%;
padding:14px;
background:#ff7a00;
border:none;
border-radius:6px;
color:white;
font-weight:bold;
}

.result{
margin-top:10px;
padding:10px;
background:#0f1f35;
border-radius:6px;
}

.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
background:#111;
}

.nav button{
flex:1;
padding:12px;
background:#111;
color:#fff;
border:none;
}

.nav button.active{
background:#ff7a00;
color:#000;
}
</style>
</head>

<body>

<div class="header">🔥 MeltingPro Smart Melt AI</div>

<!-- ================= PAGE 1 ================= -->
<div id="calcPage" class="page active">

<div class="card">
<select onchange="showCalc(this.value)">
<option value="furnace">Furnace Metal Calculator</option>
<option value="carbon">Carbon Control</option>
<option value="simn">Si-Mn Calculator</option>
<option value="ram">Ramming Mass</option>
<option value="spectro">Spectro AI</option>
</select>
</div>

<!-- FURNACE -->
<div id="furnace" class="card">
<h3>🔥 Furnace Metal Calculator</h3>

<input id="top" placeholder="Top Dia (mm)">
<input id="bottom" placeholder="Bottom Dia (mm)">
<input id="taper" placeholder="Taper Height (mm)">
<input id="height" placeholder="Total Height (mm)">

<input id="scrap" placeholder="Scrap %">
<input id="sponge" placeholder="Sponge %">
<input id="scrapY" placeholder="Scrap Yield %">
<input id="spongeY" placeholder="Sponge Yield %">

<button onclick="calcFurnace()">Calculate</button>

<div id="furnaceOut" class="result"></div>
</div>

<!-- CARBON -->
<div id="carbon" class="card" style="display:none;">
<h3>🔥 Carbon Control</h3>

<select id="cMode" onchange="toggleCarbon()">
<option value="up">Carbon UP</option>
<option value="down">Carbon DOWN</option>
</select>

<input id="metal" placeholder="Metal kg">
<input id="cNow" placeholder="Current C%">
<input id="cTarget" placeholder="Target C%">

<input id="ci" placeholder="C% in CI">
<input id="feo" placeholder="FeO% (Sponge)" style="display:none;">

<button onclick="calcCarbon()">Calculate</button>
<div id="cOut" class="result"></div>
</div>

<!-- SIMN -->
<div id="simn" class="card" style="display:none;">
<h3>⚡ Si-Mn Calculator</h3>

<input id="m" placeholder="Metal kg">
<input id="mnNow" placeholder="Current Mn%">
<input id="mnTarget" placeholder="Target Mn%">
<input id="mnAlloy" placeholder="Alloy Mn%">
<input id="rec" placeholder="Recovery %">

<button onclick="calcMn()">Calculate</button>
<div id="mnOut" class="result"></div>
</div>

<!-- RAMMING -->
<div id="ram" class="card" style="display:none;">
<h3>🧱 Ramming Mass</h3>

<input id="shell" placeholder="Shell Dia (inch)">
<input id="farma" placeholder="Farma Dia (inch)">
<input id="hR" placeholder="Height (inch)">

<button onclick="calcRamming()">Calculate</button>
<div id="ramOut" class="result"></div>
</div>

<!-- SPECTRO -->
<div id="spectro" class="card" style="display:none;">
<h3>🤖 Spectro AI</h3>

<textarea id="spectroData" placeholder="Paste spectro report"></textarea>

<button onclick="analyzeSpectro()">Analyze</button>

<div id="specOut" class="result"></div>
</div>

</div>

<!-- ================= PAGE 2 ================= -->
<div id="aiPage" class="page">

<div class="card">
<h3>⚙ Auto Alloy</h3>

<input id="metal2" placeholder="Metal kg">
<input id="cNow2" placeholder="Current C%">
<input id="cTarget2" placeholder="Target C%">
<input id="mnNow2" placeholder="Current Mn%">
<input id="mnTarget2" placeholder="Target Mn%">

<button onclick="autoAlloy()">Calculate</button>
<div id="alloyOut" class="result"></div>
</div>

<div class="card">
<h3>🤖 Tapping Decision</h3>

<input id="mn2" placeholder="Mn%">
<input id="s2" placeholder="S%">
<input id="p2" placeholder="P%">
<input id="al2" placeholder="Al%">

<button onclick="tappingDecision()">Check</button>
<div id="tapOut" class="result"></div>
</div>

<div class="card">
<h3>📊 Heat History</h3>

<button onclick="showHistory()">Show</button>
<div id="historyOut" class="result"></div>

<button onclick="saveHeat()">Save</button>
</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="openPage('calcPage',this)" class="active">🧮</button>
<button onclick="openPage('aiPage',this)">🤖</button>
</div>

<script>

// NAVIGATION
function openPage(id,btn){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById(id).classList.add('active');

document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
}

// CALC SWITCH
function showCalc(val){
["furnace","carbon","simn","ram","spectro"].forEach(x=>{
document.getElementById(x).style.display="none";
});
document.getElementById(val).style.display="block";
}

// FURNACE
function calcFurnace(){
let t=top.value/1000,b=bottom.value/1000,h=height.value/1000;
let vol=(Math.PI*h/3)*(t*t + b*b + t*b);
let metal=vol*7.5;
let y=((scrap.value*scrapY.value)+(sponge.value*spongeY.value))/100;
furnaceOut.innerHTML="🔥 "+(metal*(y/100)).toFixed(2)+" Ton";
}

// CARBON
function toggleCarbon(){
ci.style.display=(cMode.value=="up")?"block":"none";
feo.style.display=(cMode.value=="down")?"block":"none";
}

function calcCarbon(){
let m=metal.value,d=cTarget.value-cNow.value;
if(cMode.value=="up"){
cOut.innerHTML="⬆ "+((d*m)/(ci.value/100)).toFixed(1)+" kg CI";
}else{
cOut.innerHTML="⬇ "+((Math.abs(d)*m*10)/feo.value).toFixed(1)+" kg Sponge";
}
}

// SIMN
function calcMn(){
let kg=((mnTarget.value-mnNow.value)/100*m.value)/((mnAlloy.value/100)*(rec.value/100));
mnOut.innerHTML="⚡ "+kg.toFixed(1)+" kg";
}

// RAM
function calcRamming(){
let shellM=shell.value*0.0254;
let farmaM=farma.value*0.0254;
let h=hR.value*0.0254;
let kg=(Math.PI*(shellM**2-farmaM**2)/4*h)*2600;
ramOut.innerHTML="🧱 "+kg.toFixed(0)+" kg";
}

// SPECTRO AI
function analyzeSpectro(){
let txt=spectroData.value;
function v(k){let m=txt.match(new RegExp(k+"\\s*=\\s*([0-9.]+)","i"));return m?+m[1]:0;}

let C=v("C"),Mn=v("Mn"),S=v("S"),P=v("P"),Cr=v("Cr"),Cu=v("Cu"),Ni=v("Ni"),Al=v("Al");
let sum=Cr+Cu+Ni;
let grade="";

if(Cr<=0.25 && Cu<=0.25 && Ni<=0.25 && sum>=0.4 && sum<=0.7) grade="XLS";
else if(C<=0.25 && S<=0.045 && P<=0.045) grade="Fe500D";
else if(C<=0.30) grade="Fe500";
else grade="Other";

let warn="";
if(Al>0.03) warn+="🔴 Nozzle choke risk<br>";

specOut.innerHTML="🏆 "+grade+"<br>"+warn;
}

// AUTO ALLOY
function autoAlloy(){
let m=metal2.value;
let res="";
if(cTarget2.value>cNow2.value) res+="⬆ CI "+(((cTarget2.value-cNow2.value)/100*m)/0.035).toFixed(1)+" kg<br>";
if(mnTarget2.value>mnNow2.value) res+="⚡ SiMn "+(((mnTarget2.value-mnNow2.value)/100*m)/(0.6*0.75)).toFixed(1)+" kg";
alloyOut.innerHTML=res;
}

// TAPPING
function tappingDecision(){
let status="🟢 READY";
if(mn2.value<0.5||al2.value>0.03) status="🔴 HOLD";
tapOut.innerHTML=status;
}

// HISTORY
function saveHeat(){
let arr=JSON.parse(localStorage.getItem("h")||"[]");
arr.push({t:new Date().toLocaleString(),m:metal2.value});
localStorage.setItem("h",JSON.stringify(arr));
alert("Saved");
}

function showHistory(){
let arr=JSON.parse(localStorage.getItem("h")||"[]");
historyOut.innerHTML=arr.map(x=>x.t+" | "+x.m).join("<br>");
}

</script>

</body>
  </html>
