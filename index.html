<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#06121f,#0d2236);
color:white;
}

/* HEADER */
.header{
text-align:center;
padding:15px;
font-size:22px;
font-weight:bold;
color:#ff7a00;
}

/* CARD */
.card{
background:rgba(255,255,255,0.05);
padding:15px;
margin:12px;
border-radius:15px;
}

/* INPUT */
input,select,textarea{
width:100%;
padding:12px;
margin:6px 0;
border:none;
border-radius:10px;
background:#0b1b2b;
color:white;
}

/* BUTTON */
button{
width:100%;
padding:12px;
background:#ff7a00;
border:none;
border-radius:10px;
color:white;
font-weight:bold;
margin-top:10px;
}

/* RESULT */
.result{
margin-top:10px;
padding:10px;
background:#05101c;
border-radius:10px;
}

/* NAV */
.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
}

.nav button{
flex:1;
}

.page{display:none;}
.active{display:block;}

</style>
</head>

<body>

<div class="header">🔥 MeltingPro AI PRO</div>

<!-- PAGE 1 -->
<div id="p1" class="page active">

<div class="card">
<h3>🔥 Furnace Metal (Advanced)</h3>

<input id="top" placeholder="Top Dia (m)">
<input id="bottom" placeholder="Bottom Dia (m)">
<input id="height" placeholder="Height (m)">

<input id="scrapP" placeholder="Scrap %">
<input id="spongeP" placeholder="Sponge %">

<input id="scrapY" placeholder="Scrap Yield %">
<input id="spongeY" placeholder="Sponge Yield %">

<input id="fill" placeholder="Fill % (default 90)">
<input id="prev" placeholder="Previous Heat (Ton)">

<button onclick="calcFurnace()">Calculate</button>

<div id="furnaceRes" class="result"></div>

</div>

<div class="card">
<h3>🔥 Carbon AI</h3>

<select id="mode">
<option value="up">UP (CI)</option>
<option value="down">DOWN (FeO)</option>
</select>

<input id="metal" placeholder="Metal (kg)">
<input id="c1" placeholder="Current C%">
<input id="c2" placeholder="Target C%">

<input id="ci" placeholder="CI % (only UP)">
<input id="feo" placeholder="FeO % (only DOWN)">

<button onclick="calcCarbon()">Calculate</button>

<div id="carbonRes" class="result"></div>

</div>

</div>

<!-- PAGE 2 -->
<div id="p2" class="page">

<div class="card">
<h3>⚡ Mn AI</h3>

<input id="heat" placeholder="Heat kg">
<input id="mn1" placeholder="Current Mn%">
<input id="mn2" placeholder="Target Mn%">
<input id="alloy" placeholder="Alloy Mn%">
<input id="rec" placeholder="Recovery %">

<button onclick="calcMn()">Calculate</button>

<div id="mnRes" class="result"></div>
<div id="mnAI" class="result"></div>

</div>

<div class="card">
<h3>🤖 Grade AI (Smart)</h3>

<textarea id="spec" placeholder="Paste spectro report"></textarea>

<button onclick="gradeAI()">Detect</button>

<div id="gradeRes" class="result"></div>

</div>

</div>

<!-- PAGE 3 -->
<div id="p3" class="page">

<div class="card">
<h3>🧪 Slag AI</h3>

<input id="cao" placeholder="CaO%">
<input id="sio2" placeholder="SiO2%">
<input id="feoS" placeholder="FeO%">

<button onclick="slagAI()">Analyze</button>

<div id="slagRes" class="result"></div>

</div>

<div class="card">
<h3>📄 Heat Report</h3>

<textarea id="report"></textarea>

<button onclick="makeReport()">Generate</button>
<button onclick="sendWA()">📤 WhatsApp</button>

</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="show(1)">🏭</button>
<button onclick="show(2)">🤖</button>
<button onclick="show(3)">📄</button>
</div>

<script>

// PAGE
function show(p){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById("p"+p).classList.add("active");
}

// FURNACE (FIXED FRUSTUM)
function calcFurnace(){

let t=Number(top.value);
let b=Number(bottom.value);
let h=Number(height.value);

if(!t||!b||!h){
furnaceRes.innerHTML="⚠️ Enter dimensions";
return;
}

let vol=(Math.PI*h/12)*(t*t + b*b + t*b);
let density=7.5;

let fillP=(Number(fill.value)||90)/100;

let scrapP=Number(scrapP.value)||50;
let spongeP=Number(spongeP.value)||50;

let scrapY=Number(scrapY.value)||90;
let spongeY=Number(spongeY.value)||85;

let yieldF=(scrapP*scrapY + spongeP*spongeY)/10000;

let ton=vol*density*fillP*yieldF;

let prevHeat=Number(prev.value)||0;
ton=(ton+prevHeat)/2;

furnaceRes.innerHTML="🔥 "+ton.toFixed(2)+" Ton";

}

// CARBON
function calcCarbon(){

let m=Number(metal.value);
let cStart=Number(c1.value);
let cEnd=Number(c2.value);

if(!m||!cStart||!cEnd){
carbonRes.innerHTML="⚠️ Fill data";
return;
}

if(mode.value=="up"){
let ciV=Number(ci.value);
if(!ciV){carbonRes.innerHTML="⚠️ Enter CI%";return;}

let add=(m*(cEnd-cStart))/(ciV/100*0.8);
carbonRes.innerHTML="↑ Add "+add.toFixed(1)+" kg CI";

}else{

let feoV=Number(feo.value);
if(!feoV){carbonRes.innerHTML="⚠️ Enter FeO%";return;}

let red=(m*(cStart-cEnd))/(feoV/100);
carbonRes.innerHTML="↓ Use "+red.toFixed(1)+" kg Sponge";

}

}

// MN
function calcMn(){

let h=Number(heat.value);
let diff=Number(mn2.value)-Number(mn1.value);

let req=(h*diff)/((Number(alloy.value)/100)*(Number(rec.value)/100));

mnRes.innerHTML="⚡ "+req.toFixed(1)+" kg";

let msg="";
if(diff>0.3) msg+="⚠ Mn low → Increase alloy<br>";
if(diff<0.1) msg+="✔ Near target<br>";

mnAI.innerHTML=msg;

}

// GRADE AI (REAL)
function gradeAI(){

let t=spec.value.toLowerCase();

function get(k){
let m=t.match(new RegExp(k+"[\\s:-]*([0-9.]+)"));
return m?parseFloat(m[1]):0;
}

let c=get("c");
let mn=get("mn");
let s=get("s");
let p=get("p");
let cu=get("cu");
let al=get("al");

let grade="Unknown";

if(c<=0.25 && s<=0.04 && p<=0.04 && al<0.01) grade="XLS ⭐";
else if(c<=0.25 && mn>=0.5){
grade="Fe500";
if(s<=0.04 && p<=0.04) grade="Fe500D";
}
if(c<=0.23 && cu>=0.15) grade="E250Br";

gradeRes.innerHTML=`🏆 ${grade}<br>
C:${c} Mn:${mn} S:${s} P:${p} Cu:${cu} Al:${al}`;

}

// SLAG AI
function slagAI(){

let caoV=Number(cao.value);
let sio2V=Number(sio2.value);
let feoV=Number(feoS.value);

let b=caoV/sio2V;

let msg="Basicity: "+b.toFixed(2)+"<br>";

if(b<2) msg+="➡ Add Lime ~20kg<br>";
if(b>3) msg+="➡ Reduce Lime<br>";

if(feoV>28) msg+="➡ High FeO → Add Carbon<br>";
if(feoV<18) msg+="➡ Low FeO → Blow O2<br>";

slagRes.innerHTML=msg;

}

// REPORT
function makeReport(){

let d=new Date();

report.value=
`🔥 HEAT REPORT

Date: ${d.toLocaleDateString()}
Time: ${d.toLocaleTimeString()}

${furnaceRes.innerText}
${carbonRes.innerText}
${mnRes.innerText}

${gradeRes.innerText}

${slagRes.innerText}

--- MeltingPro AI ---`;

}

// WHATSAPP
function sendWA(){
window.open("https://wa.me/?text="+encodeURIComponent(report.value));
}

</script>

</body>
</html>
