<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#06121f;color:white;}
.header{text-align:center;padding:15px;font-size:22px;color:#ff7a00;}
.card{background:#0d2236;padding:15px;margin:10px;border-radius:12px;}
input,select,textarea{width:100%;padding:10px;margin:5px 0;background:#081421;color:white;border:none;border-radius:8px;}
button{width:100%;padding:12px;background:#ff7a00;border:none;border-radius:8px;color:white;}
.result{background:#000;padding:10px;margin-top:10px;border-radius:8px;}
.page{display:none;}
.active{display:block;}
.nav{position:fixed;bottom:0;width:100%;display:flex;}
.nav button{flex:1;}
</style>

</head>

<body>

<div class="header">🔥 MeltingPro</div>

<!-- PAGE 1 -->
<div id="p1" class="page active">

<div class="card">
<h3>🔥 Furnace Metal calculator</h3>

  <select id="unit" onchange="updateUnitUI()">
<option value="m">Meter</option>
<option value="cm">CM</option>
<option value="mm">MM</option>
<option value="inch">Inch</option>
</select>

<input id="top" placeholder="Top Dia (m)">
<input id="bottom" placeholder="Bottom Dia (m)">
<input id="taper" placeholder="Taper Height (m)">
<input id="height" placeholder="Total Height (m)">

<input id="scrapP" placeholder="Scrap %">
<input id="spongeP" placeholder="Sponge %">
<input id="scrapY" placeholder="Scrap Yield %">
<input id="spongeY" placeholder="Sponge Yield %">

<input id="fill" placeholder="Fill %">
<input id="prev" placeholder="Previous Heat (Ton)">

<button onclick="calcFurnace()">Calculate</button>
<div id="furnaceRes" class="result"></div>

</div>

<div class="card">
<h3>🔥 Carbon Calculator</h3>

<select id="mode" onchange="toggleCarbon()">
<option value="up">Carbon UP</option>
<option value="down">Carbon DOWN</option>
</select>

<input id="metal" placeholder="Metal (kg)">
<input id="c1" placeholder="Current C%">
<input id="c2" placeholder="Target C%">

<input id="ci" placeholder="Carbon Source %">
<input id="feo" placeholder="Slag FeO %">
<input id="scale" placeholder="Mill Scale (kg)">

<button onclick="calcCarbon()">Calculate</button>

<div id="carbonRes"></div>

<div class="card">
<h3>⚡ Mn Calculator</h3>

<select id="mnMode">
<option value="recovery">Mn Recovery</option>
<option value="required">Mn Required (kg)</option>
</select>

<input id="heat" placeholder="Metal (kg)">
<input id="mn1" placeholder="Current Mn %">
<input id="mn2" placeholder="Target Mn %">

<input id="simn" placeholder="SiMn (kg)">
<input id="mnP" placeholder="Mn % in SiMn">

<input id="feoMn" placeholder="Slag FeO %">

<input id="siP" placeholder="Si % in SiMn">
<input id="cP" placeholder="C % in SiMn">
<input id="pP" placeholder="P % in SiMn">

<button onclick="calcMn()">Calculate</button>

<div id="mnRes" class="result"></div>

<div class="card">
<h3>🤖 Grade AI</h3>

<textarea id="spec"></textarea>
<button onclick="gradeAI()">Detect</button>

<div id="gradeRes" class="result"></div>

</div>

</div>

<!-- PAGE 2 -->
<div id="p2" class="page">

<div class="card">
<h3>🧪 Slag AI</h3>

<input id="cao" placeholder="CaO%">
<input id="sio2" placeholder="SiO2%">
<input id="feoS" placeholder="FeO%">

<button onclick="slagAI()">Analyze</button>

<div id="slagRes" class="result"></div>

</div>

<div class="card">
<h3>📄 Report</h3>

<textarea id="report"></textarea>

<button onclick="makeReport()">Generate</button>
<button onclick="sendWA()">WhatsApp</button>

</div>

</div>

<div class="nav">
<button onclick="show(1)">1</button>
<button onclick="show(2)">2</button>
</div>

<script>

// ===== UNIT UI =====
function updateUnitUI(){

let u = document.getElementById("unit").value;
let label = (u === "inch") ? "in" : u;

// ✅ FIX: proper element targeting
document.getElementById("top").placeholder = "Top Dia ("+label+")";
document.getElementById("bottom").placeholder = "Bottom Dia ("+label+")";
document.getElementById("taper").placeholder = "Taper Height ("+label+")";
document.getElementById("height").placeholder = "Total Height ("+label+")";
document.addEventListener("DOMContentLoaded", function(){
updateUnitUI();
});
  
}
document.getElementById("unit").addEventListener("change",updateUnitUI);

// ===== UNIT CONVERT =====
function toMeter(v){
  let u = document.getElementById("unit").value;
if(u=="cm") return v/100;
if(u=="mm") return v/1000;
if(u=="inch") return v*0.0254;
return v;
}

// ===== PAGE =====
function show(p){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById("p"+p).classList.add("active");
}

// ===== FURNACE =====
function calcFurnace(){

let furnaceRes = document.getElementById("furnaceRes");

let scrap = Number(document.getElementById("scrapP").value)||0;
let sponge = Number(document.getElementById("spongeP").value)||0;

if(scrap+sponge!==100){
furnaceRes.innerHTML="⚠ Scrap+Sponge=100%";
return;
}

let t = toMeter(Number(document.getElementById("top").value)||0);
let b = toMeter(Number(document.getElementById("bottom").value)||0);
let taperH = toMeter(Number(document.getElementById("taper").value)||0);
let h = toMeter(Number(document.getElementById("height").value)||0);

if(!t||!b||!h){
furnaceRes.innerHTML="⚠ Enter dimensions";
return;
}

let cylH = h - taperH;
if(cylH<0)cylH=0;

let v1=(Math.PI*taperH/12)*(t*t+b*b+t*b);
let v2=Math.PI*Math.pow(t/2,2)*cylH;
let vol=v1+v2;

let scrapY = Number(document.getElementById("scrapY").value)||90;
let spongeY = Number(document.getElementById("spongeY").value)||85;

let yieldF = (scrap/100)*(scrapY/100)+(sponge/100)*(spongeY/100);

let fillP = (Number(document.getElementById("fill").value)||90)/100;

let ton = vol*7.3*fillP*yieldF;

let prevH = Number(document.getElementById("prev").value)||0;
if(prevH>0){
ton = ton + (prevH - ton)*0.7;
}

let suggestion="";
if(yieldF<0.88) suggestion+="🔴 Low Yield<br>";
else if(yieldF>0.93) suggestion+="🟢 Good Yield<br>";
else suggestion+="⚠ Medium Yield<br>";

if(fillP<0.85) suggestion+="⚠ Low Fill<br>";
else if(fillP>0.95) suggestion+="🔴 Over Fill<br>";

furnaceRes.innerHTML =
"🔥 "+ton.toFixed(2)+" Ton<br>" +
"📦 Volume: "+vol.toFixed(2)+" m³<br>" +
"📊 Yield: "+(yieldF*100).toFixed(1)+"%<br><br>" +
"🤖 AI:<br>"+suggestion;

}

// ===== CARBON TOGGLE =====
function toggleCarbon(){

let mode = document.getElementById("mode").value;

let ci = document.getElementById("ci");
let scale = document.getElementById("scale");

// UP
if(mode === "up"){
ci.style.display="block";
scale.style.display="none";
}

// DOWN
else{
ci.style.display="none";
scale.style.display="block";
}

}

// ===== FINAL CARBON CALCULATOR =====
function calcCarbon(){

let res = document.getElementById("carbonRes");

let mode = document.getElementById("mode").value;

let m  = parseFloat(document.getElementById("metal").value);
let c1 = parseFloat(document.getElementById("c1").value);
let c2 = parseFloat(document.getElementById("c2").value);

let carbonP = parseFloat(document.getElementById("ci").value);
let feo = parseFloat(document.getElementById("feo").value);
let scale = parseFloat(document.getElementById("scale").value) || 0;

if(isNaN(m) || isNaN(c1) || isNaN(c2)){
res.innerHTML = "⚠ Fill all values";
return;
}

let msg = "";

// ================= 🔼 CARBON UP =================
if(mode === "up"){

if(isNaN(carbonP) || carbonP <= 0){
res.innerHTML = "⚠ Enter Carbon Source %";
return;
}

if(c1 >= c2){
res.innerHTML = "✔ Carbon already OK";
return;
}

// recovery
let recovery = 0.75;
if(feo > 25) recovery = 0.65;
else if(feo < 15) recovery = 0.80;

// mass balance
let carbonReq = m * (c2 - c1) / 100;
let add = carbonReq / ((carbonP/100) * recovery);

msg += "⬆ Carbon Source: " + add.toFixed(0) + " kg<br>";
msg += "⚙ Recovery: " + (recovery*100).toFixed(0) + "%";

}

// ================= 🔽 CARBON DOWN =================
else{

if(c1 <= c2){
res.innerHTML = "✔ Carbon already OK";
return;
}

// 🔥 Carbon removal (kg)
let carbonRemove = m * (c1 - c2) / 100;

// 🔥 FeO required
let FeO_req = carbonRemove * 3.5;

// ================= USER INPUT =================
let scaleKg = scale || 0;

// Mill scale FeO (~70%)
let FeO_from_scale = scaleKg * 0.70;

// remaining FeO
let FeO_balance = FeO_req - FeO_from_scale;
if(FeO_balance < 0) FeO_balance = 0;

// sponge calc (FeO 11%, eff 30%)
let sponge = FeO_balance / (0.11 * 0.30);

// ================= WITHOUT SCALE =================
let sponge_no_scale = FeO_req / (0.11 * 0.30);

// ================= 🔥 AUTO BEST MIX (FIXED) =================

// same FeO_req use karo (carbon based)
let best_scale = 0;
let best_sponge = 0;

// FeO level ke basis pe split
if(feo < 15){
    // low FeO → more scale
    best_scale = FeO_req * 0.5;
}
else if(feo <= 25){
    // normal → balanced
    best_scale = FeO_req * 0.35;
}
else{
    // high FeO → less scale
    best_scale = FeO_req * 0.2;
}

// convert to kg
best_scale = best_scale / 0.70;

// remaining FeO
let FeO_rem_best = FeO_req - (best_scale * 0.70);
if(FeO_rem_best < 0) FeO_rem_best = 0;

// sponge
best_sponge = FeO_rem_best / (0.11 * 0.30);
// ================= FINAL FeO ESTIMATE =================
let finalFeO = feo + (FeO_req / m * 100);

// ================= OUTPUT =================
msg += "⬇ Sponge (your input): " + sponge.toFixed(0) + " kg<br>";
msg += "🧱 Mill Scale (your input): " + scaleKg.toFixed(0) + " kg<br><br>";

msg += "📊 Without mill scale: " + sponge_no_scale.toFixed(0) + " kg<br><br>";

msg += "🤖 Auto Best Mix:<br>";
msg += "➡ Sponge: " + best_sponge.toFixed(0) + " kg<br>";
msg += "➡ Mill Scale: " + best_scale.toFixed(0) + " kg<br><br>";

msg += "🔥 Est. Slag FeO: " + finalFeO.toFixed(1) + "%<br>";

// ================= AI =================
if(scaleKg == 0){
msg += "⚠ No mill scale → Higher sponge needed<br>";
}
else{
msg += "🟢 Mill scale used → Sponge reduced<br>";
}

// ================= FeO WARNING =================
if(finalFeO > 28){
msg += "🔴 High FeO → Mn/Si loss risk<br>";
}
else if(finalFeO < 18){
msg += "⚠ Low FeO → Carbon removal slow<br>";
}
else{
msg += "🟢 Safe FeO range (18–28%)<br>";
}

}

res.innerHTML = msg;

  }
  
// ===== MN Calculator =====
function calcMn(){

let res = document.getElementById("mnRes");

let mode = document.getElementById("mnMode").value;

let m = Number(document.getElementById("heat").value);
let mn1 = Number(document.getElementById("mn1").value);
let mn2 = Number(document.getElementById("mn2").value);

let simn = Number(document.getElementById("simn").value);
let mnP = Number(document.getElementById("mnP").value);

let feo = Number(document.getElementById("feoMn").value);

let siP = Number(document.getElementById("siP").value) || 0;
let cP = Number(document.getElementById("cP").value) || 0;
let pP = Number(document.getElementById("pP").value) || 0;

if(!m || !mn1){
res.innerHTML = "⚠ Fill required values";
return;
}

// 🔥 AUTO Mn RECOVERY (FeO based)
let rec = 0.75;
if(feo > 25) rec = 0.60;
else if(feo < 15) rec = 0.85;

let msg = "";

// ================= 🔹 Mn RECOVERY MODE =================
if(mode === "recovery"){

if(!simn || !mnP){
res.innerHTML = "⚠ Enter SiMn & Mn%";
return;
}

// Mn gain
let mnGain = simn * (mnP/100) * rec;
let finalMn = ((m * mn1/100) + mnGain) / m * 100;

msg += "⚡ Final Mn: " + finalMn.toFixed(3) + " %<br>";
msg += "⚙ Recovery: " + (rec*100).toFixed(0) + "%<br><br>";

// chemistry pickup
let siGain = simn * (siP/100) * 0.80;
let finalSi = siGain / m * 100;

let finalC = (simn * (cP/100)) / m * 100;
let finalP = (simn * (pP/100)) / m * 100;

msg += "📊 Pickup:<br>";
msg += "➡ Si: +" + finalSi.toFixed(3) + "%<br>";
msg += "➡ C: +" + finalC.toFixed(3) + "%<br>";
msg += "➡ P: +" + finalP.toFixed(3) + "%<br>";
}


// ================= 🔹 Mn REQUIRED MODE =================
else{

if(!mn2 || !mnP){
res.innerHTML = "⚠ Enter Target Mn & Mn%";
return;
}

if(mn2 <= mn1){
res.innerHTML = "✔ Already above target";
return;
}

// required Mn metal
let Mn_req = m * (mn2 - mn1) / 100;

// required SiMn
let simn_req = Mn_req / ((mnP/100) * rec);

// practical correction
if(simn_req > m*0.05){
simn_req *= 0.9;
}

// verify Mn
let mnGain = simn_req * (mnP/100) * rec;
let finalMn = ((m * mn1/100) + mnGain) / m * 100;

// ================= 🔥 AUTO SPLIT =================
let furnaceAdd = simn_req * 0.70;
let ladleAdd = simn_req * 0.30;

if(feo > 25){
furnaceAdd = simn_req * 0.60;
ladleAdd = simn_req * 0.40;
}
else if(feo < 15){
furnaceAdd = simn_req * 0.80;
ladleAdd = simn_req * 0.20;
}

// chemistry impact
let siGain = simn_req * (siP/100) * 0.80;
let finalSi = siGain / m * 100;

let finalC = (simn_req * (cP/100)) / m * 100;
let finalP = (simn_req * (pP/100)) / m * 100;

// output
msg += "🎯 Required SiMn: " + simn_req.toFixed(0) + " kg<br>";
msg += "⚡ Expected Mn: " + finalMn.toFixed(3) + " %<br>";
msg += "⚙ Recovery: " + (rec*100).toFixed(0) + "%<br><br>";

msg += "🔥 Suggested Addition:<br>";
msg += "🏭 Furnace: " + furnaceAdd.toFixed(0) + " kg<br>";
msg += "🪣 Ladle: " + ladleAdd.toFixed(0) + " kg<br><br>";

msg += "📊 Chemistry Impact:<br>";
msg += "➡ Si: +" + finalSi.toFixed(3) + "%<br>";
msg += "➡ C: +" + finalC.toFixed(3) + "%<br>";
msg += "➡ P: +" + finalP.toFixed(3) + "%<br>";
}

// ================= AI =================
if(feo > 28){
msg += "<br>🔴 High FeO → Mn loss high<br>";
}
else if(feo < 15){
msg += "<br>🟢 Low FeO → Good recovery<br>";
}
else{
msg += "<br>⚠ Normal FeO condition<br>";
}

res.innerHTML = msg;

  }

// ===== GRADE =====
function gradeAI(){
let t=spec.value.toLowerCase();
if(t.includes("0.22")) gradeRes.innerHTML="Fe500";
else gradeRes.innerHTML="XLS";
}

// ===== SLAG =====
function slagAI(){
let b=cao.value/sio2.value;
slagRes.innerHTML="Basicity "+b.toFixed(2);
}

// ===== REPORT =====
function makeReport(){
report.value=furnaceRes.innerText+"\n"+carbonRes.innerText+"\n"+mnRes.innerText;
}

// ===== WA =====
function sendWA(){
window.open("https://wa.me/?text="+encodeURIComponent(report.value));
}

// INIT
document.addEventListener("DOMContentLoaded", function(){

updateUnitUI();     // 🔥 unit fix
toggleCarbon();     // 🔥 carbon toggle fix

});

</script>

</body>
</html>
