<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeltingPro FINAL</title><style>
body{margin:0;font-family:Arial;background:#0f172a;color:#fff;}
header{background:#020617;padding:12px;text-align:center;color:#f97316;font-weight:bold;}
.tabs{display:flex;background:#1e293b;}
.tabs button{flex:1;padding:12px;border:none;background:#1e293b;color:#ccc;}
.tabs button.active{background:#f97316;color:#000;}
.section{display:none;padding:15px;}
.section.active{display:block;}
.card{background:#111827;padding:12px;margin-top:10px;border-radius:10px;}
input,select{width:100%;padding:10px;margin:5px 0;background:#1e293b;color:#fff;border:none;}
button{width:100%;padding:10px;background:#f97316;border:none;margin-top:5px;}
.result{margin-top:10px;background:#1e293b;padding:10px;}
</style></head><body><header>🔥 MeltingPro FINAL</header><div class="tabs">
<button class="active" onclick="tab(0)">Dashboard</button>
<button onclick="tab(1)">Final AI</button>
<button onclick="tab(2)">Lab</button>
</div><!-- DASHBOARD --><div class="section active"><div class="card">
<h3>🔥 Molten Metal Calculator (Pro)</h3>

<select id="metalMode" onchange="toggleMetalMode()">
<option value="furnace">Furnace</option>
<option value="ladle">Ladle</option>
</select>

<div id="furnaceMode">
<input id="topDia" placeholder="Top Dia (inch)">
<input id="bottomDia" placeholder="Bottom Dia (inch)">
<input id="taper" placeholder="Taper Height (inch)">
<input id="height" placeholder="Total Height (inch)">
</div>

<div id="ladleMode" style="display:none;">
<input id="ladleDia" placeholder="Ladle Dia (inch)">
<input id="ladleHeight" placeholder="Height (inch)">
</div>
  <canvas id="furnaceCanvas" width="300" height="400" style="background:transparent;border:1px solid #333;margin-top:10px;"></canvas>
  
  
<input id="actualMetal" placeholder="Actual Metal (ton)">
<input id="lossPct" placeholder="Loss %">

<button onclick="calcMetal()">Calculate</button>

<div id="metalOut" class="result"></div>
  
<h3>🧱 Ramming</h3>
<input id="shellDia" placeholder="Shell Dia">
<button onclick="calcRamming()">Calculate</button>
<div id="ramOut" class="result"></div>
</div><div class="card">
<h3>⚙ Mn</h3>
<input id="mnMetal" placeholder="Metal ton">
<input id="curMn" placeholder="Current Mn">
<input id="tarMn" placeholder="Target Mn">
<input id="rec" placeholder="Recovery %">
<input id="allMn" placeholder="Alloy %">
<button onclick="calcMn()">Calculate</button>
<div id="mnOut" class="result"></div>
</div><div class="card">
<h3>⚡ Carbon</h3>
<select id="mode" onchange="toggleC()">
<option value="down">Down</option>
<option value="up">Up</option>
</select><div id="cd">
<input id="cMetal" placeholder="Metal">
<input id="cCur" placeholder="Current C">
<input id="cTar" placeholder="Target C">
<input id="feo" placeholder="FeO">
</div><div id="cu" style="display:none;">
<input id="cMetalUp" placeholder="Metal">
<input id="cCurUp" placeholder="Current C">
<input id="cTarUp" placeholder="Target C">
<input id="ciPct" placeholder="CI %">
</div><button onclick="calcCarbon()">Calculate</button>

<div id="cOut" class="result"></div>
</div></div><!-- FINAL AI --><div class="section">
<div class="card"><h3>🔥 Final Tap</h3><select id="grade">
<option>Fe500</option>
<option>Fe500D</option>
<option>E250BR</option>
</select><input id="ton" placeholder="Ton">
<input id="Mn" placeholder="Mn">
<input id="Si" placeholder="Si">
<input id="P" placeholder="P">
<input id="S" placeholder="S"><input id="FeO" placeholder="FeO">
<input id="Temp" placeholder="Temp">
<input id="CaO" placeholder="CaO">
<input id="SiO2" placeholder="SiO2"><button onclick="runAI()">Run</button>

<div id="tapOut" class="result"></div></div>
</div><!-- LAB --><div class="section">
<div class="card"><h3>🧪 FeO</h3>
FeO = V × 1.6<br>
High FeO → Mn loss → Remix77<hr><h3>🧪 FeT</h3>
Fe = V × 1.117<hr><h3>🧪 Basicity</h3>
CaO/SiO2 = 2–2.5</div>
</div><script>

// TAB
function tab(n){
let b=document.querySelectorAll(".tabs button");
let s=document.querySelectorAll(".section");
b.forEach(x=>x.classList.remove("active"));
s.forEach(x=>x.classList.remove("active"));
b[n].classList.add("active");
s[n].classList.add("active");
}

function calcMetal(){
try{

let mode = document.getElementById("metalMode").value;

// ================= FURNACE =================
if(mode === "furnace"){

let top = parseFloat(document.getElementById("topDia").value);
let bottom = parseFloat(document.getElementById("bottomDia").value);
let taper = parseFloat(document.getElementById("taper").value);
let height = parseFloat(document.getElementById("height").value);

if(!top || !bottom || !taper || !height){
document.getElementById("metalOut").innerHTML="❌ Enter all values";
return;
}

// inch → meter
top *= 0.0254;
bottom *= 0.0254;
taper *= 0.0254;
height *= 0.0254;

// volume
let r1 = top/2;
let r2 = bottom/2;

let v1 = (Math.PI * taper / 3) * (r1r1 + r2r2 + r1r2);
let v2 = Math.PI * r2r2 * (height - taper);

let volume = v1 + v2;

// ton
let ton = (volume * 7200) / 1000;
ton = ton * 0.90;

// kg
let kg = ton * 1000;

// auto fill
document.getElementById("actualMetal").value = ton.toFixed(2);

// output
document.getElementById("metalOut").innerHTML =
"🔥 "+ton.toFixed(2)+" Ton ("+kg.toFixed(0)+" kg)";

// draw
drawFurnace(top, bottom, taper, height);

}

// ================= LADLE =================
else{

let dia = parseFloat(document.getElementById("ladleDia").value);
let h = parseFloat(document.getElementById("ladleHeight").value);

if(!dia || !h){
document.getElementById("metalOut").innerHTML="❌ Enter ladle values";
return;
}

// inch → meter
dia *= 0.0254;
h *= 0.0254;

let r = dia/2;

let volume = Math.PI * r*r * h;

let ton = (volume * 7200) / 1000;
ton = ton * 0.95;

let kg = ton * 1000;

document.getElementById("actualMetal").value = ton.toFixed(2);

document.getElementById("metalOut").innerHTML =
"🔥 "+ton.toFixed(2)+" Ton ("+kg.toFixed(0)+" kg)";

// ladle drawing
drawLadle(dia, h);

}

}catch(e){
document.getElementById("metalOut").innerHTML="❌ Error";
console.log(e);
}
                                  }
  
// RAM
function calcRamming(){
let s=parseFloat(shellDia.value)||0;
let ton=(s*s)/500;
ramOut.innerHTML="🧱 "+ton.toFixed(2)+" Ton";
}

// MN
function calcMn(){
let m=mnMetal.value||0;
let need=m*(tarMn.value-curMn.value)*10;
let alloy=need/(allMn.value/100)/(rec.value/100);
mnOut.innerHTML="⚙ "+alloy.toFixed(1)+" kg";
}

// CARBON
function toggleC(){
cd.style.display=(mode.value==="up")?"none":"block";
cu.style.display=(mode.value==="up")?"block":"none";
}

function calcCarbon(){
if(mode.value==="down"){
let kg=(cMetal.value*(cCur.value-cTar.value)*6)/feo.value;
cOut.innerHTML="⬇ "+kg.toFixed(1)+" kg";
}else{
let kg=(cMetalUp.value*(cTarUp.value-cCurUp.value)/100)/(ciPct.value/100);
cOut.innerHTML="⬆ "+kg.toFixed(1)+" kg";
}
}

// AI
function runAI(){

let t=ton.value;
let Mn0=Mn.value;

let need=((0.6-Mn0)*t*1000)/0.6;

let msg="SiMn: "+need.toFixed(0)+" kg<br>";

if(FeO.value>15) msg+="🔴 High FeO<br>";
if(Temp.value>1670) msg+="🔴 High Temp<br>";

tapOut.innerHTML=msg;

}

 function drawFurnace(top, bottom, taper, height){

let c = document.getElementById("furnaceCanvas");
if(!c || height<=0) return;

let ctx = c.getContext("2d");

ctx.clearRect(0,0,c.width,c.height);

let scale = 150 / height;

let h = height * scale;
let t = taper * scale;
let topW = top * scale;
let botW = bottom * scale;

let x = 150;
let y = 20;

ctx.strokeStyle = "#f97316";
ctx.lineWidth = 2;

ctx.beginPath();
ctx.moveTo(x - topW/2, y);
ctx.lineTo(x + topW/2, y);
ctx.lineTo(x + botW/2, y + t);
ctx.lineTo(x + botW/2, y + h);
ctx.lineTo(x - botW/2, y + h);
ctx.closePath();
ctx.stroke();

  }

  function drawLadle(dia, height){

let c = document.getElementById("furnaceCanvas");
if(!c) return;

let ctx = c.getContext("2d");

ctx.clearRect(0,0,c.width,c.height);

let scale = 150 / height;

let h = height * scale;
let w = dia * scale;

let x = 150;
let y = 20;

ctx.strokeStyle = "#00c2ff";
ctx.lineWidth = 2;

ctx.strokeRect(x - w/2, y, w, h);

  }
</script></body>
</html>
