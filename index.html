<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#06121f;color:white;}
.header{text-align:center;padding:15px;font-size:22px;color:#ff7a00;}
.card{background:#0d2236;padding:15px;margin:10px;border-radius:12px;}
input,select,textarea{width:100%;padding:10px;margin:5px 0;background:#081421;color:white;border:none;border-radius:8px;}
button{width:100%;padding:12px;background:#ff7a00;border:none;border-radius:8px;color:white;}
.result{background:#000;padding:10px;margin-top:10px;border-radius:8px;}
.page{display:none;}
.active{display:block;}
.nav{position:fixed;bottom:0;width:100%;display:flex;}
.nav button{flex:1;}
</style>

</head>

<body>

<div class="header">🔥 MeltingPro FINAL</div>

<!-- PAGE 1 -->
<div id="p1" class="page active">

<div class="card">
<h3>🔥 Furnace Metal calculator</h3>

  <select id="unit" onchange="updateUnitUI()">
<option value="m">Meter (m)</option>
<option value="cm">Centimeter (cm)</option>
<option value="mm">Millimeter (mm)</option>
<option value="inch">Inch (in)</option>
  </select>
<input id="top" placeholder="Top Dia (m)">
<input id="bottom" placeholder="Bottom Dia (m)">
<input id="taper" placeholder="Taper Height (m)">
<input id="height" placeholder="Total Height (m)">

<input id="scrapP" placeholder="Scrap %">
<input id="spongeP" placeholder="Sponge %">
<input id="scrapY" placeholder="Scrap Yield %">
<input id="spongeY" placeholder="Sponge Yield %">

<input id="fill" placeholder="Fill %">
<input id="prev" placeholder="Previous Heat (Ton)">

<button onclick="calcFurnace()">Calculate</button>
<div id="furnaceRes" class="result"></div>

</div>

<div class="card">
<h3>🔥 Carbon</h3>

<select id="mode" onchange="toggleCarbon()">
<option value="up">UP</option>
<option value="down">DOWN</option>
</select>

<input id="metal" placeholder="Metal kg">
<input id="c1" placeholder="Current C%">
<input id="c2" placeholder="Target C%">
<input id="ci" placeholder="CI %">
<input id="feo" placeholder="FeO %">

<button onclick="calcCarbon()">Calculate</button>
<div id="carbonRes" class="result"></div>

</div>

</div>

<!-- PAGE 2 -->
<div id="p2" class="page">

<div class="card">
<h3>⚡ Mn</h3>

<input id="heat" placeholder="Heat kg">
<input id="mn1" placeholder="Current Mn%">
<input id="mn2" placeholder="Target Mn%">
<input id="alloy" placeholder="Alloy Mn%">
<input id="rec" placeholder="Recovery %">

<button onclick="calcMn()">Calculate</button>

<div id="mnRes" class="result"></div>
<div id="mnAI" class="result"></div>

</div>

<div class="card">
<h3>🤖 Grade AI</h3>

<textarea id="spec"></textarea>
<button onclick="gradeAI()">Detect</button>

<div id="gradeRes" class="result"></div>

</div>

</div>

<!-- PAGE 3 -->
<div id="p3" class="page">

<div class="card">
<h3>🧪 Slag AI</h3>

<input id="cao" placeholder="CaO%">
<input id="sio2" placeholder="SiO2%">
<input id="feoS" placeholder="FeO%">

<button onclick="slagAI()">Analyze</button>

<div id="slagRes" class="result"></div>

</div>

<div class="card">
<h3>📄 Report</h3>

<textarea id="report"></textarea>

<button onclick="makeReport()">Generate</button>
<button onclick="sendWA()">WhatsApp</button>

</div>

</div>

<div class="nav">
<button onclick="show(1)">1</button>
<button onclick="show(2)">2</button>
<button onclick="show(3)">3</button>
</div>

<script>

  function updateUnitUI(){

let u = document.getElementById("unit").value;

let label = u;
if(u=="inch") label="in";

document.getElementById("top").placeholder = "Top Dia ("+label+")";
document.getElementById("bottom").placeholder = "Bottom Dia ("+label+")";
document.getElementById("taper").placeholder = "Taper Height ("+label+")";
document.getElementById("height").placeholder = "Total Height ("+label+")";

  }
  function toMeter(val){

let u = document.getElementById("unit").value;

if(u=="m") return val;
if(u=="cm") return val/100;
if(u=="mm") return val/1000;
if(u=="inch") return val*0.0254;

return val;
  }
// PAGE
function show(p){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById("p"+p).classList.add("active");
}

// FURNACE
function calcFurnace(){

let t = toMeter(Number(document.getElementById("top").value));
let b = toMeter(Number(document.getElementById("bottom").value));
let totalH = toMeter(Number(document.getElementById("height").value));
let taperH = toMeter(Number(document.getElementById("taper").value));

if(!t || !b || !totalH){
furnaceRes.innerHTML="⚠️ Enter all dimensions";
return;
}

// safe taper
if(taperH > totalH) taperH = totalH;

let straightH = totalH - taperH;

// ===== FRUSTUM =====
let v1 = (Math.PI * taperH / 3) *
((t/2)**2 + (b/2)**2 + (t/2)*(b/2));

// ===== CYLINDER =====
let v2 = Math.PI * (b/2)**2 * straightH;

let volume = v1 + v2;

// ===== MATERIAL MIX =====
let scrap = Number(scrapP.value) || 50;
let sponge = Number(spongeP.value) || 50;

// density (REALISTIC)
let density =
(scrap/100 * 7.8) +
(sponge/100 * 3.5);

// ===== YIELD =====
let scrapYv = Number(scrapY.value) || 90;
let spongeYv = Number(spongeY.value) || 85;

let yieldMix =
((scrap * scrapYv) + (sponge * spongeYv)) / 10000;

// ===== FILL =====
let fillP = (Number(fill.value) || 90) / 100;

// ===== FINAL =====
let ton = volume * density * yieldMix * fillP;

// ===== PREVIOUS HEAT =====
let prevHeat = Number(prev.value) || 0;

if(prevHeat > 0){
ton = (ton + prevHeat) / 2;
}

// ===== OUTPUT =====
furnaceRes.innerHTML =
"🔥 "+ton.toFixed(2)+" Ton<br>" +
"📦 Volume: "+volume.toFixed(2)+" m³<br>" +
"⚙ Yield: "+(yieldMix*100).toFixed(1)+"%";

}
  
// CARBON
function toggleCarbon(){
if(mode.value=="up"){
ci.style.display="block";
feo.style.display="none";
}else{
ci.style.display="none";
feo.style.display="block";
}
}

function calcCarbon(){

let m=+metal.value,c1v=+c1.value,c2v=+c2.value;

if(mode.value=="up"){
let ciV=+ci.value;
let add=(m*(c2v-c1v))/(ciV/100*0.8);
carbonRes.innerHTML="Add "+add.toFixed(1)+" kg CI";
}else{
let sponge=(m*(c1v-c2v))/0.5;
carbonRes.innerHTML="Use "+sponge.toFixed(1)+" kg Sponge";
}
}

// MN
function calcMn(){

let m=+heat.value;
let diff=+mn2.value-+mn1.value;

let req=(m*diff)/((+alloy.value/100)*(+rec.value/100));

mnRes.innerHTML="⚡ "+req.toFixed(1)+" kg";

let msg="";
if(diff>0.3) msg+="Mn low<br>";
mnAI.innerHTML=msg;
}

// GRADE
function gradeAI(){

let t=spec.value.toLowerCase();

function get(k){
let m=t.match(new RegExp(k+"[\\s:-]*([0-9.]+)"));
return m?parseFloat(m[1]):0;
}

let c=get("c"),mn=get("mn"),s=get("s"),p=get("p"),cu=get("cu"),al=get("al");

let grade="Unknown";

if(c<=0.25&&s<=0.04&&p<=0.04&&al<0.01) grade="XLS";
else if(c<=0.25&&mn>=0.5) grade="Fe500";
if(s<=0.04&&p<=0.04&&grade=="Fe500") grade="Fe500D";
if(c<=0.23&&cu>=0.15) grade="E250Br";

gradeRes.innerHTML=`${grade}<br>C:${c} Mn:${mn} S:${s} P:${p}`;
}

// SLAG
function slagAI(){

let b=cao.value/sio2.value;

let msg="Basicity "+b.toFixed(2)+"<br>";

if(b<2) msg+="Add Lime<br>";
if(b>3) msg+="Reduce Lime<br>";

if(feoS.value>28) msg+="High FeO<br>";

slagRes.innerHTML=msg;
}

// REPORT
function makeReport(){

let d=new Date();

report.value=
`HEAT REPORT

${furnaceRes.innerText}
${carbonRes.innerText}
${mnRes.innerText}
${gradeRes.innerText}
${slagRes.innerText}

Date:${d.toLocaleDateString()}`;
}

// WA
function sendWA(){
window.open("https://wa.me/?text="+encodeURIComponent(report.value));
}

toggleCarbon();
window.onload = function(){
updateUnitUI();
   }
</script>

</body>
</html>
